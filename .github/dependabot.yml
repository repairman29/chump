version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # INFRA-038 / INFRA-8654: group compatible patch+minor bumps into one weekly
    # PR (#5910) and ignore routine breaking semver-major bumps (which bundle
    # incompatible API/native-link upgrades like rusqlite + wasmtime without code
    # migrations and fail CI every week). Dependabot security updates remain
    # active for all versions, including major advisories.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["ci"]
    # INFRA-196: ignore actions/{upload,download}-artifact bumps (cargo-dist
    # release.yml template drift).
    # INFRA-8654: ignore dtolnay/rust-toolchain — Dependabot rewrites workflow
    # refs to non-existent @1.120.0 tags instead of honoring rust-toolchain.toml.
    ignore:
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "actions/download-artifact"
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions-all:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

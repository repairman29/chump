name: docs-pages

# Publishes the Warm-Stone Chump Product Suite (`web/site/`) at the GitHub Pages
# root (`/`) and the curated MkDocs operator documentation (`docs/`) under `/docs/`.
# Read-only build using only the auto-scoped GITHUB_TOKEN for Pages deployment.
on:
  push:
    branches: [main]
    paths:
      - 'web/site/**'
      - 'web/icon.svg'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install mkdocs toolchain
        if: runner.os == 'Linux'
        run: pip install -r docs/requirements-docs-site.txt

      - name: Assemble product site and documentation bundle
        if: runner.os == 'Linux'
        run: |
          rm -rf _pages
          mkdir -p _pages
          cp -R web/site/. _pages/
          cp web/icon.svg _pages/icon.svg
          touch _pages/.nojekyll
          mkdocs build -d _pages/docs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

name: release-plz

# Runs on main after changes to publishable crates; opens release PRs and
# publishes to crates.io when a release PR is merged.
# Why: automates the tedious version-bump + publish dance for chump-coord,
# chump-perception, and chump-tool-macro.

on:
  push:
    branches:
      - main
    paths:
      - "chump-tool-macro/**"
      - "crates/chump-coord/**"
      - "crates/chump-perception/**"
      - ".release-plz.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no publishing)"
        required: false
        default: "true"
        type: boolean

# Least-privilege default. The `test` job only reads the repository; the
# `release-plz` and `publish` jobs carry their own job-level write grants.
permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

# INFRA-1378: workflow-level group, do NOT cancel — release PRs serialize and
# must finish to keep crates.io publish state consistent.
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  test:
    name: Test and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests for publishable crates
        # CREDIBLE-1538: scope test + verify to the three publishable crates
        # (chump-tool-macro, chump-coord, chump-perception) rather than the
        # entire workspace + un-ignored cargo audit, which belong to ci.yml
        # and cargo-audit-nightly.yml.
        run: |
          cargo test --manifest-path chump-tool-macro/Cargo.toml
          cargo test --manifest-path crates/chump-coord/Cargo.toml
          cargo test --manifest-path crates/chump-perception/Cargo.toml

      - name: Check MSRV for publishable crates
        run: |
          cargo check --manifest-path chump-tool-macro/Cargo.toml
          cargo check --manifest-path crates/chump-coord/Cargo.toml
          cargo check --manifest-path crates/chump-perception/Cargo.toml

  release-plz:
    name: Release (dry-run)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check crates.io registry token availability
        id: creds
        env:
          HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
          HAS_APP: ${{ secrets.QUEUE_DRIVER_APP_ID != '' && secrets.QUEUE_DRIVER_APP_PRIVATE_KEY != '' }}
        run: |
          echo "has_cargo_token=${HAS_CARGO_TOKEN}" >> "$GITHUB_OUTPUT"
          echo "has_app=${HAS_APP}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_CARGO_TOKEN}" != "true" ]; then
            echo "release-plz: CARGO_REGISTRY_TOKEN secret is not configured; skipping release-pr dry-run cleanly." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mint GitHub App token for release PRs
        id: app_token
        if: steps.creds.outputs.has_cargo_token == 'true' && steps.creds.outputs.has_app == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.QUEUE_DRIVER_APP_ID }}
          private-key: ${{ secrets.QUEUE_DRIVER_APP_PRIVATE_KEY }}

      - name: Install release-plz
        if: steps.creds.outputs.has_cargo_token == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz

      - name: Run release-plz (dry-run)
        if: steps.creds.outputs.has_cargo_token == 'true'
        run: |
          release-plz release-pr \
            --backend github \
            --git-token "${GIT_TOKEN}"
        env:
          GIT_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Report dry-run status
        run: |
          echo "✓ release-plz check complete"
          echo "  If CARGO_REGISTRY_TOKEN is configured and publishable crates changed, release-plz opens/updates the release PR."

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release-plz
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Check crates.io registry token availability
        id: creds
        env:
          HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          echo "has_cargo_token=${HAS_CARGO_TOKEN}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_CARGO_TOKEN}" != "true" ]; then
            echo "release-plz publish: CARGO_REGISTRY_TOKEN secret is not configured; skipping crates.io publish cleanly." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.has_cargo_token == 'true'
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        if: steps.creds.outputs.has_cargo_token == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.creds.outputs.has_cargo_token == 'true'

      - name: Install release-plz
        if: steps.creds.outputs.has_cargo_token == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz

      - name: Check for release PR
        id: check-pr
        if: steps.creds.outputs.has_cargo_token == 'true'
        run: |
          # release-plz will only publish if all checks pass and a release commit exists
          # This step is informational; actual publishing happens via release-plz
          echo "status=ready" >> "$GITHUB_OUTPUT"

      - name: Publish (via release-plz)
        if: steps.creds.outputs.has_cargo_token == 'true' && steps.check-pr.outputs.status == 'ready'
        run: |
          release-plz release publish \
            --backend github \
            --git-token "${{ secrets.GITHUB_TOKEN }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

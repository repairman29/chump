# Placeholder CI — replace with real checks (e.g. cargo fmt/test, npm test) when code lands.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scaffold smoke
        run: echo "OK — add build steps when the project has a stack."

  design-pass:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Design pass (placeholder)
        run: bash .github/scripts/design-pass.sh
      - name: Post design-pass comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Design pass: manual review required. No automated checks configured yet.'
            })

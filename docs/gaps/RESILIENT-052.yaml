  title: "bot-merge exit-144-silent recurs post-#2169 — root-cause + loud-fail + regression test"
  status: done
  closed_pr: 4010
  priority: P1
  effort: m
  acceptance_criteria:
    - bot-merge no longer exits 144 silently; on failure it prints the failing step and a non-zero diagnosable cause, and a regression test reproduces the exit-144 condition asserting a loud failure.
  notes: |
    [2026-08-20T00:00:00Z] RECONCILE: already shipped via PR #4010
    (8cb1bcb6, "fix(RESILIENT-052): bot-merge ERR trap — root-cause +
    loud-fail for silent exit-144"), merged 2026-08-20. Root cause:
    bot-merge.sh ran under 'set -euo pipefail' with no ERR trap, so any
    child process dying non-zero (e.g. gh crashing on SIGURG, exit 144)
    propagated silently — indistinguishable from a hang. Added
    trap '_bm_err_handler "$?" "$BASH_COMMAND" "$LINENO"' ERR
    (scripts/coord/bot-merge.sh:396) which prints the failing step, exit
    code, and decoded signal name to stderr and emits
    kind=bot_merge_uncaught_error to ambient.jsonl (registered in
    EVENT_REGISTRY.yaml). scripts/ci/test-bot-merge-err-trap-loud-fail.sh
    reproduces the exit-144 condition against the real extracted handler
    and asserts a loud failure — verified passing (10/10) on this worktree
    at HEAD. All AC bullets are met. Gap YAML was left status:open in this
    worktree only — state.db has no open row for RESILIENT-052. Same
    reconcile pattern as RESILIENT-218 (#4014) / RESILIENT-081 (#4015).
  outcome_id: RESILIENT-000


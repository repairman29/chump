- id: INFRA-3580
  domain: INFRA
  title: reopening a gap leaves a stale closed_pr and there is no supported way to clear it
  status: open
  priority: P1
  effort: s
  acceptance_criteria:
    - "ESCALATED P2->P1 2026-08-09: this is a CORRECTNESS risk, not cosmetic. Reopened gaps carry a stale closed_pr, and that is EXACTLY the state scripts/ci/test-gap-closure-consistency.sh calls stale_post_merge_gap (reverse mode, CREDIBLE-039). Measured right now: RESILIENT-262 open closed_pr=3544, RESILIENT-265 open closed_pr=3544, CREDIBLE-265 open closed_pr=3551 — three gaps repaired tonight sitting in the exact shape a detector treats as a fault"
    - "THE RISK IS LIVE THE MOMENT A CONSUMER IS WIRED. Nothing consumes stale_post_merge_gap today, so the repair holds. CREDIBLE-275 asks for consumers to be wired for events that have none — doing that without fixing this first could RE-CLOSE the gaps we just recovered. Sequence matters: fix this before wiring that consumer"
    - "THERE IS NO SUPPORTED WAY TO CLEAR IT: chump gap set --closed-pr rejects an empty value (\"expects a positive integer\"), no --clear-closed-pr exists, and direct sqlite UPDATE is correctly refused by tooling policy since it bypasses CLI invariants"
    - "FIX: let --status open clear closed_pr and closed_date automatically — reopening logically retracts the close — or add an explicit --clear-closed-pr. Guard it behind CHUMP_ALLOW_RECYCLE like the reopen itself, so it cannot quietly rewrite shipping history"
    - "VERIFY: reopen a gap that has closed_pr set, then assert sqlite reports zero rows for status=open AND closed_pr IS NOT NULL. Today that count is 3 and cannot be driven to zero by any supported command"
    - "SCOPE: repair path for CREDIBLE-268. 268 is why gaps get falsely closed; this is why the damage cannot be fully undone once they are"
  outcome_id: MISSION-010


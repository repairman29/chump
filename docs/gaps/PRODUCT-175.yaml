- id: PRODUCT-175
  domain: PRODUCT
  title: "[almanac] Fleet summarize backfill runs as session-spawned nohup workers - machine sleep kills it every night"
  status: open
  priority: P2
  effort: s
  description: |
    The summary backfill (llama3.2:3b via Mac+helsinki Ollama, queue/lockdir design in ~/.almanac: summarize-queue.txt, summarize-locks/, summarize-worker.sh with the 2026-08-02 health gate) is launched via nohup+caffeinate from interactive sessions. caffeinate -i does not survive lid-close: rounds 1-3 all died to Saturday-evening sleep and needed manual relaunch. The worker script is already idempotent and resumable - it just needs a durable owner. Fix: a launchd job (or the existing cron layer) that runs N workers when the queue has unclaimed entries, so the backfill and future re-summarize sweeps survive sleep/reboot without a human relaunching them.
    

  title: "bot-merge preflight not-found: INFRA-1434 title-similarity blocks freshly-claimed gap from worktree state.db import"
  status: done
  priority: P1
  effort: m
  acceptance_criteria:
    - "Root cause: bot-merge runs in a worktree whose state.db is fresh/empty; it runs `chump gap import` to populate it, but INFRA-1434 title-similarity BLOCKS the gap-being-shipped from importing (treats re-import of an existing gap as a new duplicate) → preflight reports \"not found in state.db\" → ship aborts. Hit RESILIENT-065 + CREDIBLE-080 on 2026-06-03."
    - "Fix: title-similarity guard must NOT block import of a gap whose ID already exists (re-import != new duplicate); the guard is for reserve-time new-gap creation, not import of known gaps. OR worktree provisioning shares/copies main state.db so no import is needed."
    - "After fix: bot-merge.sh --gap <ID> for a freshly-claimed gap completes preflight (gap found in state.db) and proceeds to push/PR without requiring a CHUMP_BYPASS_BOT_MERGE workaround."
    - "CI test: import a docs/gaps/<ID>.yaml whose title is >0.85 similar to an existing gap but whose ID already exists -> import succeeds (gap present in state.db), not blocked."
  depends_on: [INFRA-2435]

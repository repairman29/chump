    - gated
    - "planned and emitter_paths: [list] for every kind"
    - All currently-never-emitted kinds receive triage classification (wired/gated/removed) committed in the same PR
    - New chump health subcommand or report tab surfaces declared-vs-firing count delta from the last 24h of ambient.jsonl
    - docs/observability/README.md (create if missing) describes the registry contract and the truth-audit gate
    - "Post-merge: chump-ambient-glance.sh shows no widgets for permanently-zero kinds"

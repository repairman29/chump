  status: open
  priority: P2
  effort: m
  description: |
    docs/observability/EVENT_REGISTRY.yaml declares ~416 event kinds. tail -2000 .chump-locks/ambient.jsonl | jq -r .kind | sort -u shows <20 distinct kinds firing in practice. Documented-but-never-emitted kinds include hang_detector, invariant_recovered, gap_check_false_positive, pr_dedup_bypassed, roadmap_update_proposal_*, planner_rank_ran and 40+ others. Dashboards / war-room / chump-ambient-glance read this registry as ground truth and display widgets for kinds that never fire — operator trust erodes. Audit should triage each declared kind into one of three buckets: wire emitter, gate behind feature flag with note, or remove from registry.
  acceptance_criteria:

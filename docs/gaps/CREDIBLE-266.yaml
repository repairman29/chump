- id: CREDIBLE-266
  domain: CREDIBLE
  title: the agent loop logs provider_ms but never WHICH provider — a 15-slot cascade with no way to see which slot served the turn
  status: done
  closed_pr: 3647
  priority: P1
  effort: s
  acceptance_criteria:
    - "WHAT CANNOT BE ANSWERED TODAY, and every one of these is an operator question that came up within a minute of the gateway going live: which models actually carry my traffic; is the cascade ever reaching past slot 1; did that reply spend a PAID slot or a free one; which slot is slow; which slot is silently failing over. A 15-slot failover ladder that cannot be observed is a config file, not a system"
    - "MINIMUM FIX: add the resolved provider slot and model name to the existing INFRA-185 phase-timings line in chump::agent_loop::orchestrator. It already carries request_id, compaction_ms, provider_ms, tools_ms, rounds and total_ms — adding provider_slot and model is the smallest possible change with the largest payoff, and it makes every existing log line retroactively useful"
    - ALSO EMIT IT AS AN AMBIENT EVENT so it is queryable rather than greppable. Per-slot call counts over time are what turn the inference inventory work (RESILIENT-270, INFERENCE_AS_ATTENTION) from a plan into something measurable. Without it, any claim about which models the fleet uses is unfalsifiable
    - "RECORD FAILOVER, NOT JUST THE WINNER: when slot N fails and N+1 answers, log both and the reason (401/403, 429, model-not-found, tool-call-refused). That failure signature is exactly what EFFECTIVE-366 and the no-probing constraint need — it is how a faucet turning off gets detected from real traffic rather than by spending quota on synthetic pings"
    - NEVER LOG CREDENTIALS. Slot number, model name, base-URL HOST at most. No keys, not even partially — the same rule the escalation channel follows
    - "VERIFY ON REAL TRAFFIC: send two Discord DMs and read the log. Each turn must name the slot and model that served it. Then force a slot failure (revoke one key in a scratch config) and confirm the failover and its reason are both recorded"
    - "MEASURED BASELINE to compare against: 2026-08-09 live turns showed provider_ms 309 and 503 with tools_ms 0 and rounds 1, so sub-second replies are real — the question is only which slot earned them"

    - gap_promote
    - merge_approval
    - scope_clarify, gap_id?, pr_number?, summary, priority, created_at}
    - "Source of decisions: scan .chump-locks/ambient.jsonl for kind=operator_decision_needed events (new event kind, register in docs/observability/EVENT_REGISTRY.yaml) emitted by orchestrator/picker/bot-merge when operator input is required"
    - web/v2/app.js decisions queue component renders the response and removes the endpoint-pending error placeholder; POST /api/decisions/{id}/resolve writes the operator response back as kind=operator_decision_resolved
    - "scripts/ci/test-decisions-endpoint.sh smoke test: emit a synthetic operator_decision_needed event, GET /api/decisions, assert it appears, POST resolve, assert it disappears"
    - docs/process/CLAUDE_GOTCHAS.md gains a Decisions queue subsection documenting the contract

  title: "EFFECTIVE: /api/decisions backend endpoint — PWA calls it, returns 404, no operator-decision queue surfaces (sibling to INFRA-1338 /api/roadmap)"
  status: open
  priority: P2
  effort: s
  description: |
    web/v2/app.js lines 1909, 2855-2884 attempt to render a decisions queue UI component that calls GET /api/decisions; the backend endpoint does not exist, the call 404s, and the frontend has no error handling. Sibling to INFRA-1338 (/api/roadmap endpoint, P2/m) which has the same shape but for roadmap data. Operator-decisions queue is part of the Phase 3 Orchestrator MVP doctrine (operator types high-level intents → orchestrator surfaces decisions for confirmation). Today the queue UI is dead.
  acceptance_criteria:

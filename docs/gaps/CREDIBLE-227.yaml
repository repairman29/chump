- id: CREDIBLE-227
  domain: CREDIBLE
  title: provider slot limits are hand-entered and never verified — two slots declare the SAME model with a 57x RPD difference
  status: open
  priority: P2
  effort: m
  acceptance_criteria:
    - "PROOF THE CONFIG IS UNRELIABLE (measured 2026-08-07 from .env): CHUMP_PROVIDER_4 (name=gemini) and CHUMP_PROVIDER_8 (name=gemini-2.5-flash) both declare MODEL=gemini-2.5-flash, but slot 4 says RPM=360/RPD=86400 while slot 8 says RPM=10/RPD=1500. Same model, same provider, 57x apart on daily limit — at least one is wrong, and any capacity planning done from these numbers is fiction"
    - "A refresh job probes each enabled slot and records OBSERVED limits: read rate-limit response headers (x-ratelimit-limit-requests / -remaining / retry-after) on a cheap call, and GET /v1/models to confirm the configured MODEL still exists and is not deprecated. Store observed alongside configured"
    - "DRIFT IS REPORTED, NOT SILENTLY OVERWRITTEN: when observed disagrees with configured, file it (holler -> gap) rather than auto-editing .env, because a bad probe must not quietly rewrite the fleet's inference config. Same discipline as the organ findings"
    - "4 OF 13 SLOTS CANNOT BE RATE-LIMITED AT ALL: CHUMP_PROVIDER_12/13/14/15 declare only BASE/KEY/MODEL/MODEL_CLASS — no RPM, TIER, PRIORITY or CONTEXT_K. Either backfill their metadata or make the loader refuse/warn on an incomplete slot, so a half-declared slot is visible instead of silently unlimited"
    - "provider_quality.rs already records success/failure/latency/tool-call outcomes and drives demotion, but NOTHING compares observation back to the configured ceiling. Close that loop: a slot repeatedly 429ing well under its declared RPD is evidence the declared number is wrong, and that signal is already being collected and thrown away"
    - "HONEST CONSEQUENCE TO RECORD: a same-session capacity claim ('100K+ free requests/day idle') was made from the 86400 figure and had to be retracted. Config read as measurement is exactly the signal-vs-outcome error this fleet keeps making"
  outcome_id: CREDIBLE-000


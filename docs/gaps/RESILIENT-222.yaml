- id: RESILIENT-222
  domain: RESILIENT
  title: bot-merge integrator health check treats not-running daemon as healthy (PID=- last-exit=0) → gaps stuck in batched dead-queue limbo
  status: open
  priority: P2
  effort: s
  description: |
    bot-merge.sh _bm_integrator_healthy() (scripts/coord/bot-merge.sh ~1929) checks: (1) chump-integrator binary exists, (2) launchctl last-exit==0. But it does NOT check the daemon is actually RUNNING. A daemon that exited cleanly (exit 0) but is NOT loaded/running shows 'launchctl list' as '-  0  com.chump.integrator-daemon' (PID='-', exit=0) → the check reads exit=0 → 'healthy' → bot-merge routes gap to Mode A (batched integration queue) → nothing alive drains it → gap stuck in 'ready_to_ship' limbo, branch never pushed. Observed 2026-08-01: EFFECTIVE-347 routed to batched queue twice while the daemon was down; only forcing CHUMP_BOT_MERGE_MOCK_INTEGRATOR_HEALTH=0 (per-PR Mode B, INFRA-2523) unstuck it. FIX: health check must also require the daemon to be currently loaded+running (PID present, not '-'), not merely last-exit==0. Otherwise INFRA-2523's fail-open never fires for a cleanly-stopped daemon — the exact limbo it was meant to prevent.
  acceptance_criteria:
    - "The change described by \"bot-merge integrator health check treats not-running daemon as healthy (PID=- last-exit=0) → gaps stuck in batched dead-queue limbo\" is implemented in the relevant RESILIENT code path(s)."
    - At least one test (cargo test or scripts/ci/test-*.sh) proves the new behavior and fails without the change.
    - cargo fmt + clippy --all-targets -D warnings + check pass; no regression to existing tests.


  evidence: |
    MISSION-045 session 2026-07-27: audit.yml outcome-gate step was flagged UNMIRRORED for 3 iterations though the script WAS in preflight.rs's mirror set. Root cause: scripts/ci/test-preflight-ci-parity.sh:293 sets run_cmd=run_lines[0], so gate_script_path() only sees the first line of a multi-line run: block. Safe fix = extract the actual invoked test (bash scripts/ci/test-*.sh), not the first scripts/ci path (naive join would mis-match 'source .../lib/discover-chump-bin.sh' lines). Mitigated in #3331 by forcing a single-line run:.


  description: |
    Probe run 2026-08-07, unplanned: almanac_search_fleet 'retry exponential backoff' returned implementations in 13 repos — postsub, beast-mode (FOUR separate ones), slidemate, bulwark, code-roach, coderoach, echeovid, maclawd, openclaw, smuggler (two), smugglers, trove-web. Structural evidence of copying, not convergent design: bulwark:src/retry-patterns.js:10 and smugglers:shared-utils/retry-patterns/index.js:10 are the same class at the same line; RetryService sits at src/services/retryService.js:6 in three separate repos. And smugglers/shared-utils/retry-patterns/ proves an extraction ALREADY HAPPENED and never propagated. That is the fleet's latent-value shape in one query: not missing capability, unpropagated capability. Build 'almanac census <concept>' — every implementation across registered repos, literal-copy detection by structural identity (same symbol, same relative path, same line), and an extractability score from what almanac already measures (importer count, coupling via neighbors/impact, test presence). Output ranks 'built N times, here is the best one, here is the adoption cost'. Serves rule 5 (mine before archive), the ZERO-WASTE pillar, and the living-stack mission, since extracted shared components ARE the stack. Scope narrowly: a --concept query over the existing index first, proven on the retry case, BEFORE any general clustering pass.
  acceptance_criteria:
    - "almanac census <concept> lists every implementation across registered repos with repo:path:line, grouped so one capability reads as one row with N sites"
    - literal copies are flagged by structural identity (same symbol name + same relative path + same start line), distinguishing 'copied' from 'independently written' — the retry case must show bulwark/smugglers and the three RetryService sites as copies
    - each cluster carries an extractability signal computed from real index data (importer counts, coupling, test presence), and states which inputs were unavailable rather than scoring on partial data
    - "the report names an EXISTING extraction when one is present — smugglers/shared-utils/retry-patterns is the proof case: the tool must say 'already extracted, N repos have not adopted it'"
    - "honest about vocabulary: keyword mode only finds shared-vocabulary concepts, so the output states its retrieval mode and warns that divergent naming is invisible until fleet embedding coverage (15% on 2026-08-07) drains"
    - "dogfood receipt: the retry census output recorded in the gap notes"
    - DEPTH.md updated same commit

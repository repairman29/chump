- id: RESILIENT-072
  domain: RESILIENT
  title: "RESILIENT P1: preflight cargo-test wrapper usage-bug skips ALL tests — forces bypass-or-fail on every push (waste driver)"
  status: open
  priority: P1
  effort: s
  description: |
    Found 2026-06-03 validating MISSION-008. chump preflight's cargo-test step invokes scripts/ci/cargo-test-with-rerun.sh WITHOUT the required '-- <cmd>' args, so it prints 'usage: ...' and exits non-zero — the cargo-test gate FAILS without running a single test. Every other preflight gate (fmt/clippy/check/registry/integrity/links) passed. Net effect: every push that touches Rust either fails preflight on cargo-test or bypasses it (Test-Gate-Bypass / Preflight-Skip), so the test gate is effectively OFF fleet-wide and unverified code reaches CI -> rework. STRONG suspect for a chunk of the current L2-SLO-2 token-waste breach (40% vs 5% target) and the CI churn. Fix in src/preflight.rs: invoke the wrapper with the correct '-- cargo test ...' form (or call cargo test directly).
  acceptance_criteria:
    - "chump preflight cargo-test step actually runs the test suite (no 'usage:' error); a green run shows real test counts"
    - a regression test asserts the wrapper is invoked with its required -- <cmd> args
  outcome_id: RESILIENT-000


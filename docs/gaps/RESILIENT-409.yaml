- id: RESILIENT-409
  domain: RESILIENT
  title: farmer gate must not RED-block free-tier/deepseek claims on stale Anthropic-oauth mtime (RESILIENT-069 self-strangle)
  status: done
  priority: P1
  effort: s
  description: |
    CJ fleet dark ~31.5h (0 merges since 2026-08-24T16:14Z). All 3 workers logged
    RESILIENT-069 farmer status RED every 60s. Root: check_oauth_fresh in
    src/farmer_status.rs falls through to ~/.chump/oauth-token.json mtime>3600s
    and RETURNS RED, but the execute-gap floor uses the free-tier deepseek
    cascade (CHUMP_FREE_TIER_PROVIDERS) and never uses the Anthropic oauth
    token -- auth-status.sh returns GREEN. The oauth refresher
    (install-oauth-refresh-launchd.sh) is macOS-launchd-only so the token file
    is perpetually stale on Linux/CJ. Recurs every ~OAUTH_TOKEN_MAX_AGE_S.
  acceptance_criteria:
    - "1) In src/farmer_status.rs check_oauth_fresh, when a free-tier cascade is configured (CHUMP_FREE_TIER_PROVIDERS non-empty), a stale ~/.chump/oauth-token.json mtime MUST NOT force oauth_fresh=false; fail-open with an explanatory reason. 2) Unit test: free-tier env + 33-day-old oauth-token.json + no fresh auth-status-cache => oauth_fresh true (GREEN). 3) Regression test: WITHOUT free-tier env, stale token still => RED (unchanged). 4) auth-status-cache rc!=0 BROKEN branch still forces RED even in free-tier mode (real auth failure not masked). 5) farmer status stays local-only, no network, <100ms."
  notes: |
    [2026-08-26] Fix already landed on main via PR #4236 (commit ccd9fbdc,
    "fix(RESILIENT-409): decouple farmer claim-gate from stale Anthropic-oauth
    mtime under free-tier floor") before this session's gap dispatch reached
    the fleet -- src/farmer_status.rs already has free_tier_cascade_active()
    and oauth_token_verdict() with the RESILIENT-409 markers, plus unit tests
    stale_token_reds_by_default / stale_token_decoupled_under_free_tier /
    fresh_token_green_regardless_of_free_tier covering AC1-3 and AC5. AC4
    (auth-status-cache BROKEN still forces RED under free-tier) holds
    structurally: that branch in check_oauth_fresh returns before ever
    consulting free_tier_cascade_active(). state.db in this worktree never
    reflected the close (same class as RESILIENT-408). This is a doc-only
    sync of the tracked gap yaml to done, mirroring the RESILIENT-408
    precedent -- no code change needed.
  closed_date: '2026-08-26'

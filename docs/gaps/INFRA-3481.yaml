    - "gonogo::parse_verdict maps a fixture of 5 LLM-shaped output lines (2 GO / 2 NO-GO / 1 NEEDS-NARROWING) to the correct Verdict, and Verdict::blocks_build() returns true for NoGo+NoGoOnCost and false for Go+NeedsNarrowing — asserted by `cargo test gonogo::` (green)."
    - "gonogo::cost_axis(estimate_usd, ceiling_usd) returns Verdict::NoGoOnCost when estimate>ceiling and passes the input verdict through otherwise: unit test with (8.0,5.0)->NoGoOnCost and (3.0,5.0)->passthrough passes in src/gonogo.rs #[cfg(test)]."
    - "`chump gonogo \"<vision>\" --json` prints a JSON object with keys verdict/reason/cost_estimate_usd/tier_ceiling_usd and exits non-zero for NO-GO and NO-GO-ON-COST, 0 for GO/NEEDS-NARROWING — exit codes asserted in scripts/ci/test-gonogo.sh using CHUMP_GONOGO_FORCE_VERDICT."
    - "With CHUMP_GONOGO_FORCE_VERDICT=NO-GO, `chump bootstrap \"x\" --dir <tmp> --skip-arch-decision` exits non-zero, creates no .git/ or Cargo.toml in <tmp>, and prints the plain-language reason; with CHUMP_GONOGO_SKIP=1 it scaffolds exactly as today — both asserted in scripts/ci/test-gonogo.sh."
    - scripts/ci/test-gonogo.sh is mirrored into src/preflight.rs (or classified Tier-D/allowlist per CLAUDE.md) so `chump preflight` and the preflight-vs-CI parity gate stay green after the new gate is added.

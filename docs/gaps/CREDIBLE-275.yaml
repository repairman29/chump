  outcome_id: CHUMPOS
  evidence: |
    COMMAND: git grep -l gap_flipped_done_on_merge origin/main; git show origin/main:scripts/ci/test-event-registry-coverage.sh | grep -ic consumer; git show origin/main:docs/observability/EVENT_REGISTRY.yaml | grep -A10 "kind: gap_flipped_done_on_merge" | OUTPUT: the registry declares consumers [fleet-brief, ops-audit, waste-tally] for that kind. The ONLY code file referencing the kind is its emitter, scripts/ops/github-webhook-receiver.py. The three named consumers exist as tools (39, 6 and 49 files respectively) but none reads this kind. The coverage gate mentions the word consumer ZERO times. Separately, .chump-locks/ambient.jsonl holds 30 gap_flipped_done_on_merge events across 8 PRs, none of which was ever read by anything | THEORY: the EVENT_REGISTRY contract is enforced on the EMIT side only. INFRA-1237/INFRA-1287 fail CI on emit-without-register AND register-without-emit, so the emit half is rigorous. The consumers field is pure documentation — nothing checks that a declared consumer actually references the kind, so the declaration is aspiration presented as fact | ALT: rejected "the consumers do not exist" — all three are real tools with substantial code. The defect is narrower and worse: they exist, are named as consumers, and do not consume this kind


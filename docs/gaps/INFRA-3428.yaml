- id: INFRA-3428
  domain: INFRA
  title: "ZERO-WASTE: Decompose oversized src/main.rs into modules"
  status: open
  priority: P2
  effort: l
  description: |
    The current 'src/main.rs' is approximately 18,000 lines long and serves as a monolithic catch-all for subcommand implementations, internal helpers, and tests. This makes it difficult to maintain, increases compile times for small changes, and creates merge friction. This gap tracks the decomposition of 'src/main.rs' into a modular structure (e.g., 'src/cmd/', 'src/util/', etc.) while preserving functionality.
  acceptance_criteria:
    - src/main.rs is reduced to < 1000 lines
    - Subcommand logic is moved to dedicated modules in src/
    - Codebase compiles and all tests pass after decomposition
    - No regression in CLI behavior


- id: RESILIENT-057
  domain: RESILIENT
  title: "RESILIENT: non-expiring credential floor + validate-before-use — OAuth-primary auto mode, API-key fallback floor, cached pre-spawn validation in src/auth.rs"
  status: open
  priority: P1
  effort: m
  acceptance_criteria:
    - "1. AuthMode::Auto prefers OAuth when both present (OAuth is cost-primary); API key is the fallback floor\n2. key-absent behavior unchanged: OAuth-only still resolves to OAuth mode\n3. validate-before-use cached check wired at spawn site; on auth failure falls back before spawn\n4. fail-open: network/timeout/rate-limit errors do NOT trigger auth fallback\n5. regression test: dead OAuth + API key => ApiKey mode + fleet_auth_fallback event\n6. all existing src/auth.rs tests pass unchanged"
  notes: |
    [2026-06-04T02:07:17Z] LIVE EVIDENCE 2026-06-04 (~8h fleet outage): proves this gap is load-bearing. oauth-refresh failed ('keychain entry Claude Code-credentials not found') → OAUTH dead since 17:37. The API-key FLOOR WAS SET (launchctl ANTHROPIC_API_KEY, 109 chars, via com.chump.auth-floor-setenv) but workers STILL emitted 586 AUTH_DEAD + operator_recall — i.e. the floor is present but NOT reaching/being-preferred-by the worker processes (they don't inherit launchctl env or aren't routed to api-key mode on OAUTH-death). The validate-before-use + floor-routing-to-workers in THIS gap is the durable fix. Immediate recovery = re-auth OR launchctl setenv CHUMP_AUTH_MODE api-key.

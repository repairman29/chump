- id: INFRA-1672
  domain: INFRA
  title: "EFFECTIVE: chump preflight --scope <path> — runs only the CI gates that apply to changed paths"
  status: done
  priority: P2
  effort: m
  description: |
    INFRA-1670's preflight runs ALL gates by default. For speed, it should auto-scope to just the gates that apply to the changed paths (mirror what the GH Actions 'changes' path-filter does). A docs-only PR shouldn't run cargo clippy on the whole workspace.
  acceptance_criteria:
    - "chump preflight reads .github/workflows/ci.yml's 'changes:' filter section as ground truth for which gates apply to which paths"
    - For a given staged diff vs origin/main, computes the minimal set of gates to run
    - "--scope ALL forces the full set (override for paranoia)"
    - "Speed target: docs-only PR preflight in <5s; scripts-only in <15s; full Rust PR in <60s warm"
    - "CI test: scripts/ci/test-preflight-scope.sh — feeds synthetic diffs (docs-only, scripts-only, rust-only, mixed) and verifies preflight runs only the matching gates"
  notes: |
    P2 because INFRA-1670 alone is enough to unblock the daily-tax; this gap is the speed-tier upgrade.

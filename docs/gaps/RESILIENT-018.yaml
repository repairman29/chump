  acceptance_criteria:
    - "New scripts/ci/lib/ci-guards.sh helper exports check_gh_token_or_skip with single-line use: source the lib then call check_gh_token_or_skip "
    - ""
    - " exit 0 (exit 0 = pass with WARN, not fail)"
    - All test scripts that call gh api or gh pr from inside scripts/ci/ MUST source ci-guards.sh and call check_gh_token_or_skip first; lint gate scripts/ci/test-gh-in-ci-guarded.sh greps for raw gh-api or gh-pr in scripts/ci/test-NAME.sh that don't source ci-guards.sh and FAILs

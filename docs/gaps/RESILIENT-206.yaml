  acceptance_criteria:
    - "The change described by \"worker.sh chump-local path doesn't propagate CHUMP_FREE_TIER_PROVIDERS to execute-gap — falls back to dead local model\" is implemented in the relevant RESILIENT code path(s)."
    - At least one test (cargo test or scripts/ci/test-*.sh) proves the new behavior and fails without the change.
    - cargo fmt + clippy --all-targets -D warnings + check pass; no regression to existing tests.

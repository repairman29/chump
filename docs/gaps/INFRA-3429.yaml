- id: INFRA-3429
  domain: INFRA
  title: "ZERO-WASTE: Replace unwrap() and expect() with Result handling in src/main.rs"
  status: open
  priority: P1
  effort: m
  description: |
    Multiple instances of '.unwrap()' and '.expect()' were found in production paths of 'src/main.rs', particularly in CLI JSON output formatting and configuration loading. This violates the 'AGENTS.md' code style guidelines which mandate returning 'Result' and using '?' or explicit 'match' in production code. This gap tracks a systematic sweep and replacement of these calls with proper error handling.
  acceptance_criteria:
    - All .unwrap() and .expect() calls in non-test paths of src/main.rs are replaced with Result handling
    - Error messages are descriptive and use .context() where appropriate
    - No panics are triggered by invalid user input or missing files
  evidence: |
    COMMAND: chump zzznotacommand (also: chump proposals list). OUTPUT: prints 'chump config: enabled=[discord,...,brain]' then 'Response from Agent: ...It seems like you've entered something that doesn't appear to be a command... If you're feeling sleepy (given the zzz)...' — a conversational LLM hallucination — and exits 0. THEORY: unrecognized subcommands fall through to the brain/discord agent dispatch instead of the clap unknown-subcommand error path, and the agent path returns exit 0. ALT: brain-fallback for natural-language queries may be intentional, but it must NOT swallow obviously-typo'd subcommand tokens and must NEVER exit 0 on unrecognized CLI input — a fleet script with a typo'd chump subcommand currently 'succeeds' silently.

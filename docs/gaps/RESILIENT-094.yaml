  title: "RESILIENT: onboard auto-select prefers heaviest local model (qwen2.5:14b) → HTTP-unreachable/crash under load on 24GB; prefer a faster model + retry/fallback to lighter on provider error"
  status: done
  priority: P2
  effort: m
  description: |
    EFFECTIVE-141 made onboard auto-select an available local model, preferring
    the LARGEST (qwen2.5:14b). Live BEAST-MODE scout: it auto-selected

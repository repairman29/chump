  acceptance_criteria:
    - scripts/git-hooks/pre-push invokes 'cargo nextest run' when cargo-nextest is on PATH — proven by capturing the command the hook ACTUALLY executes (set -x trace or a shim on PATH), not by grepping the source for the word nextest
    - "On a commit where 'cargo test --bin chump' fails only on the known env race, the pre-push gate PASSES: run both runners on the SAME commit in a clean detached worktree and paste both summary lines (today on fbb60a1c that is 21-failed/exit-101 vs 2405-passed/exit-0)"
    - When cargo-nextest is ABSENT the gate still runs the suite and states loudly which runner it fell back to — a missing tool must never silently skip tests or auto-pass
    - A test under scripts/ci/ proves the previous two criteria and FAILS if the change is reverted
    - "Anti-recurrence: this gap may only be closed by a PR whose diff actually touches scripts/git-hooks/pre-push (or its test wrapper) — verify with 'git log -S nextest -- scripts/git-hooks/pre-push' returning NON-EMPTY. CREDIBLE-175 was closed by a PR that merely mentioned it; do not repeat that"
    - The count of CHUMP_TEST_GATE=0 bypasses in recent commit trailers is recorded before and after, so the fix is measured by bypasses stopping, not by the diff landing
  outcome_id: MISSION-010
  evidence: |
    COMMAND: clean detached worktree at origin/main fbb60a1c; cargo test --bin chump ; cargo nextest run --bin chump ; git log -S nextest -- scripts/git-hooks/pre-push  |  OUTPUT: SAME COMMIT, two runners — cargo test = FAILED, 2384 passed / 21 failed, exit 101; cargo nextest run = 2405 passed, 0 failed, exit 0. main is NOT red. The 21 failures are all repo_tools:: / repo_path:: and pass under --test-threads=1: cargo test runs tests as threads in one process and they race on process-global env (CHUMP_REPO), while nextest gives each test its own process. CI already uses nextest (.github/workflows/ci.yml:1429 'cargo test (nextest via INFRA-764 flake auto-rerun wrapper)', installed :1375 per INFRA-2094). But scripts/git-hooks/pre-push has 16 'cargo test' references and ZERO 'nextest', via scripts/ci/cargo-test-with-rerun.sh (3 / 0). `git log -S nextest -- scripts/git-hooks/pre-push` returns EMPTY: pre-push has never contained that string in any commit in repo history.  |  THEORY: the local gate and the CI gate disagree about the same commit, so every push must be waved through with CHUMP_TEST_GATE=0. That is worse than having no gate: it trains indiscriminate bypassing, and the same env var that waves through a known race waves through a real regression. Observed live — PR #3562 was blocked by this on 2026-08-10, shipped only after measuring both revisions back to back to prove the failures pre-existed, then passed 27/27 in CI. INFRA-761's flake auto-rerun cannot rescue it: it logged 'no parseable failed-test names; not a flake shape'. NOTE ON PROVENANCE: CREDIBLE-175 describes exactly this fix and is marked done with closed_pr 3552 — but PR #3552 changed only .env.example, uncommitted-wip-watchdog.sh, install-wip-watchdog-launchd.sh, src/git_safety.rs and tests/git_safety_e2e.rs. Its BODY merely mentioned the cargo-test race while explaining its own bypass, and auto-flip-on-merge closed the gap for citing it (CREDIBLE-268, still open). The INFRA-456 recycled-ID guard makes done terminal without operator authorization, so this is a new ID rather than a reopen; CREDIBLE-175 should be treated as a FALSE DONE.  |  ALT: considered fixing the ~21 racing tests individually with #[serial] — rejected as the wrong layer and already partly filed (INFRA-1192, RESILIENT-091); nextest isolates the whole class by construction, and CI proves it works. Considered deleting the pre-push test gate — rejected: the gate is not wrong to exist, it is running the wrong runner. Considered treating it as cosmetic since CI is green — rejected: the cost is not red pixels, it is that every developer and agent has a habituated bypass for the one gate that would catch a real break.


- id: META-327
  domain: META
  title: "CREDIBLE: Consolidate fragmented strategic roadmaps into canonical source"
  status: open
  priority: P2
  effort: s
  description: |
    Strategic documentation is currently fragmented across multiple active-looking roadmap files (e.g., ROADMAP.md, ROADMAP_WAVES.md, ROADMAP_OPUS_SEQUENCING.md). This creates ambiguity for both human operators and agents regarding current priorities. This gap tracks the consolidation of these documents into a single canonical source of truth with clear wave/sequencing definitions.
  acceptance_criteria:
    - Redundant roadmap files are archived or deleted
    - A single canonical ROADMAP.md (or similar) is established
    - All active mission and wave definitions are unified in the canonical doc


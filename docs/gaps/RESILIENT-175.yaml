- id: RESILIENT-175
  domain: RESILIENT
  title: "RESILIENT: integrator --once leaves the CANONICAL checkout on its integration branch after a wedged cycle — operator checkout hijack; integrate in a worktree or restore branch on exit"
  status: open
  priority: P2
  effort: s
  description: |
    After the integrator wedged on the ghost ref (2026-07-19), the CANONICAL checkout ~/Projects/Chump was left sitting on chump/integration-2026-07-19-1549 with no upstream — pull broken, operator confusion, and any background mutator committing there would land on a dead branch. chump-integrator --once runs 'cd $REPO && ...' directly in the canonical checkout. It must either do integration work in a dedicated worktree (like every other agent is forced to) or trap-restore the original branch on every exit path including wedges.
  acceptance_criteria:
    - integrator performs merges in a dedicated linked worktree OR restores the pre-cycle branch via trap on all exit paths
    - "regression test: simulated wedged cycle (fetch failure) leaves the canonical checkout branch untouched"
    - ambient event on any branch-restore so occurrences are auditable


- id: RESILIENT-262
  domain: RESILIENT
  title: "CI-failure triage + operator escalation: diagnose the red check, decide retry vs escalate, and reach Jeff's phone when a production line stops"
  status: open
  priority: P1
  effort: l
  opened_date: 2026-08-19
  acceptance_criteria:
    - "OPERATOR'S REQUIREMENT, verbatim intent: retry-once is not good enough. Dispatch a job that finds out WHAT IS HAPPENING, reports back whether to retry, and defines how to escalate. If a production line is shut down he must get an iMessage (or equivalent that reaches his PHONE) so he can decide"
    - "IMMEDIATE FIX FIRST, it is one line of the problem: the operator-recall handler is dead. Restart it and make it survive reboot (launchd, like docs-autocommit), because every other part of this gap is worthless if the delivery channel is not running. Then add a liveness check — a notification channel that fails silently is worse than none, since it manufactures false confidence that someone would have been told"
    - "BUILD THE TRIAGE JOB. Trigger: a REQUIRED check goes red on an auto-merge-armed PR. It must fetch the failing job's log and classify into at least: (a) known flake — listed in KNOWN_FLAKES.yaml, retry within budget; (b) suspected flake — same check is green on main at a comparable SHA, retry once then escalate; (c) real failure — reproducible/deterministic, do NOT retry, comment the diagnosis on the PR; (d) infrastructure — runner died, watchdog timeout, cache/network, retry; (e) STRUCTURALLY UNMERGEABLE — e.g. RESILIENT-250's gap-status-guard vs PROOF-OF-MERGE deadlock, where retrying is guaranteed waste and it must escalate IMMEDIATELY"
    - "THE CLASSIFICATION IS TEXT-IN/TEXT-OUT AND BELONGS ON THE FREE TIER, per INFERENCE_AS_ATTENTION: reading a CI log and bucketing the failure is exactly crowd-shaped work. Use N-model agreement as the confidence signal — unanimous accept, split escalate. Do not spend Claude on triage that a cheap model can do, and do not let a single cheap model's verdict close or retry anything on its own"
    - "EVERY DECISION LEAVES A RECEIPT: post the classification + reasoning + evidence as a PR comment and an ambient event, so a wrong call is auditable after the fact. The auto-closer must cite the triage verdict; it must never again close a PR with no recorded diagnosis"
    - "AUTO-CLOSE IS GATED ON TRIAGE. pr-failure-auto-rescue may close ONLY when triage classified the failure as (c) real. A check that is unclassified, or outside the flake-rerun wrapper, must escalate rather than close. #3510 is the proof: it was closed on a check that was both false AND outside the retry wrapper"
    - "PHONE DELIVERY IS AN OPERATOR CHOICE, do not pick unilaterally — iMessage via osascript is free but needs his Mac awake and Messages signed in; Pushover is already a supported channel in install-operator-recall-channel.sh and delivers to the phone independent of the Mac. Ask, then implement one. Whichever is chosen, the message must carry: what stopped, why triage could not resolve it, and the specific decision being requested"
    - RATE-LIMIT AND SEVERITY-GATE THE PHONE CHANNEL. Only 'a production line is stopped' reaches the phone. Everything else goes to ambient/holler. An escalation channel that cries wolf gets muted, and a muted channel is the dead handler all over again
    - "VERIFY ON THE REAL INCIDENT: replay #3510's final state (armed PR, one red required check, that check green on main, check outside the flake wrapper) and assert triage classifies it as suspected-flake, retries, and does NOT close. That is the regression test for this whole gap"
  depends_on: [RESILIENT-266, CREDIBLE-266]
  closed_pr: 3544
  outcome_id: CHUMPOS
  evidence: |
    COMMAND: inspection of operator-recall config/handler + the #3510 auto-close | OUTPUT: ~/.chump/operator-recall.toml exists and is enabled with channel type=terminal-notifier, but the handler is NOT RUNNING — pgrep -f operator-recall-handler returns 0 processes against a stale pidfile (2407, written May 8). Meanwhile pr-failure-auto-rescue (INFRA-3542) closed PR #3510 at 22:32 on 2026-08-08 after a single false-red check, destroying 23h of ready work, and the operator learned about it only by asking hours later | THEORY: the escalation channel is built, configured, and dead; and even alive it is terminal-notifier — a macOS desktop popup that only reaches the operator while he is sitting at that Mac | ALT: rejected 'no escalation machinery exists' — it does (INFRA-665 operator-recall, webpush-escalation, stuck-pr-filer, fleet-wedge-escalation). This is another built-not-wired instance, not a greenfield build


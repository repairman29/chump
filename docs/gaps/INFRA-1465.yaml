- id: INFRA-1465
  domain: INFRA
  title: "RESILIENT: bot-merge.sh writes per-PR checkpoint state so session-restart can resume in-flight ships"
  status: open
  priority: P2
  effort: m
  acceptance_criteria:
    - "Surfaced 2026-05-15/16 across multiple Claude-Code session restarts: bot-merge.sh launched in background (15-min wall-clock per INFRA-1399 budget), session ended/restarted, orphaned bot-merge process kept running but operator lost visibility. New session had to manually check ps + gh pr list to figure out which PRs were mid-ship."
    - "scripts/coord/bot-merge.sh: at each phase entry (test-gate, push, gh-pr-create, arm-auto-merge), write JSON checkpoint to .chump-locks/bot-merge-checkpoint-<pr-or-branch>.json with {phase, pid, started_at, last_heartbeat, branch, gap}. Updated every 10s while alive. Removed on success."
    - "New cmd scripts/coord/bot-merge-resume.sh <branch-or-pr>: reads the checkpoint, detects whether the original PID is still alive (kill -0). If alive — tail its log. If dead — re-invoke bot-merge.sh from the last completed phase (skip steps before it)."
    - Emit kind=bot_merge_checkpoint_written {phase, pr} on each phase-entry
    - Emit kind=bot_merge_resume_invoked {original_pid, last_phase, action} when resume cmd runs
    - "Smoke test scripts/ci/test-bot-merge-checkpoint.sh: synthetic bot-merge.sh invocation killed mid-phase, run resume, assert it picks up from last checkpointed phase"
    - Register both kinds in EVENT_REGISTRY.yaml
    - "Out of scope: cross-machine resume (NATS-backed checkpoints) — single-machine is enough"
  notes: |
    Demoted P1→P2 2026-07-19 re-rank: open >60 days with no ship activity; P1 now reserved for current-cycle critical path (docs/ROADMAP.md). Re-promote freely if picked up.
  outcome_id: MISSION-010


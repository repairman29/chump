    - "- New scripts/ops/chump-post-integration-prune.sh — listens for integration_cycle_shipped ambient events; prunes per-gap branches on origin after a grace window (default 24h).\n- Behavior:\n    1. tail -F .chump-locks/ambient.jsonl "

- id: RESILIENT-371
  domain: RESILIENT
  title: residentize the board's NON-merge watch on CJ — a deterministic, deduped board-vitals organ that pages Jeff on box/worker-wedge/merge-drought/main-red incidents the merge-SLA beat can't see, so the human board stops hand-watching them every /loop tick
  status: in_progress
  priority: P1
  effort: s
  acceptance_criteria:
    - "ROOT CAUSE: the board-cycle beat (INFRA-3590) + escalate organ (RESILIENT-373) residentized ONE dimension of the human board's per-loop watch — the 30-minute merge SLA — and page deduped. But each loop tick the human board also checks box health (disk), worker liveness (a wedged worker the farmer's kick can't revive), merge DROUGHT (0 merges for hours with 0 PRs in flight and no worker producing — distinct from an SLA breach, which needs an armed green PR to even exist), and sustained main-red. On CJ those sensors are DARK: chump-disk-health-monitor / chump-disk-pressure-watchdog / chump-fleet-worker-watchdog are Mac-launchd units that were never ported (Helsinki port-list debt), so NOTHING pages Jeff when / fills or a worker wedges. vital-signs.sh is a KPI dashboard (writes json), not a pager, and its timer is inactive on CJ."
    - "FIX: scripts/coord/lib/board-vitals.sh — a deterministic, threshold-gated, DEDUPED consolidated watch invoked by the ALREADY-RESIDENT board-cycle beat (so it rides an is-active+is-enabled timer with no new root-owned systemd unit). Checks: (1) box/disk df -P / >=90% page; (2) merge drought = last-merge-age >= 180m AND prs_in_flight==0 (from the newest board_cycle_report_posted, NOT unknown) AND worker not producing; (3) worker wedge = no worker signal (token_usage_partial/gap_*) >= 40m AND farmer_silent_worker within 20m (the farmer confirmed a leased session silent and its kick did not revive it); (4) main sustained-red span >= 30m. Pages via notify-operator.sh under kind=board_vitals_alert (registry verdict page), deduped per signature per 2h window (copied from board-cycle-escalate.sh). Always returns 0 — an escalation organ must never break the beat."
    - "JUDGMENT ESCALATION: when a worker-silence is UNCLASSIFIABLE by the deterministic rules (silent >=40m yet neither a drought nor a farmer-confirmed wedge), escalate to a bounded `claude -p --model sonnet` diagnosis (hard timeout, skipped in DRY_RUN) and page WITH the one-paragraph diagnosis (deduped). Routine watch stays deterministic + cheap; only the novel case reaches a capable model, then Jeff."
    - "ANTI-FIREHOSE (Jeff's standing order RESILIENT-274): a clean tick NEVER pages; a persisting incident pages ONCE per signature per window, not every cycle. CHUMP_BOARD_VITALS_DRY_RUN=1 logs the EXACT message it WOULD send (kind=board_vitals_page_dryrun) + honors dedup, for verification without DMing the phone."
    - "OBSERVABILITY: every emitted kind (board_vitals_tick, board_vitals_alert, board_vitals_page_sent, board_vitals_page_deduped, board_vitals_page_dryrun, board_vitals_novel_escalation) registered in docs/observability/EVENT_REGISTRY.yaml in the SAME change (strict-emit gate); board_vitals_alert added to scripts/coord/operator-escalation-registry.txt as page."
    - "TEST: scripts/ci/test-board-vitals.sh — self-contained + offline; forces a disk incident (threshold below real usage) to drive the real page+dedup path, asserts paged-exactly-once-across-two-runs, clean-cycle-is-quiet, and the main-red-span / prs-in-flight helpers. 12 assertions, PASS."
    - "LIVE PROOF ON CJ (merged != running): after this lands on origin/main and CJ's reset loop pulls it, the board-cycle beat sources board-vitals.sh each cycle; assert a board_vitals_tick line lands in .chump-locks/ambient.jsonl on the timer, and a DRY_RUN (or a real benign test) shows the exact Discord message it would/did send to the operator, deduped on repeat."
  outcome_id: CHUMPOS
  evidence: |
    COMMAND: systemctl is-active chump-disk-health-monitor.timer chump-fleet-worker-watchdog.timer (on CJ) | OUTPUT: inactive / NO TIMER — the box + worker sensors are Mac-launchd and never ported to CJ, so no resident organ pages on disk-full or worker-wedge | THEORY: the board-cycle beat pages only on the 30m merge SLA (needs an armed green PR to exist); box/worker/drought/main-red are unwatched-as-pagers on owned iron, leaving the human board to hand-check them each /loop tick | ALT: rejected 'port the three Mac-launchd watchdogs individually' — three more root-owned units to install + roll-call, when the board-cycle beat is already resident and the human board wants ONE consolidated deduped verdict, not three scattered self-healing sensors; board-vitals rides the existing timer and pages only the residue the self-heals leave unresolved

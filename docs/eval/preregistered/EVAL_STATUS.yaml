# EVAL_STATUS.yaml — execution status for every preregistration in this
# directory (INFRA-1562). Preregistration LOCKED != executed; this file is
# the one place that tracks whether the sweep actually ran.
#
# status enum: pending | running | complete | abandoned
#   pending   — preregistration locked, no (or an incomplete) result doc yet
#   running   — harness actively collecting trial data
#   complete  — result doc filed at docs/eval/<result_doc_path>, cites this prereg
#   abandoned — will not be executed; reason recorded in `notes`
#
# scripts/ci/test-preregistered-eval-status.sh asserts every
# docs/eval/preregistered/*.md (excluding README.md/TEMPLATE.md/
# COST_OPTIMIZATION.md) has a matching entry here.


# EVAL_STATUS.yaml — execution status for every preregistration in this
# directory (INFRA-1562). Read by `chump eval list` and asserted against by
# scripts/ci/test-preregistered-eval-status.sh (every *.md here except
# README.md/TEMPLATE.md/COST_OPTIMIZATION.md must have a matching entry).
#
# status values:
#   pending    — preregistration locked, no trial data collected yet
#   running    — harness actively collecting trial data
#   complete   — data collection finished; result_doc_path has the writeup
#                (or, for moved-to-private preregs, the private-repo pointer)
#   abandoned  — will not be executed; reason recorded inline
#
# last_run_ts: ISO-8601 UTC of the most recent harness run, or null if none.
# result_doc_path: path to the public result doc, or null if none/private.


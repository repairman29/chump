# CAPABILITY_BUCKETS.yaml — CREDIBLE-173
#
# Maps module/crate paths to the 16 capability areas named in
# docs/CODEBASE_REALITY_MAP.md §2 (8 tidy, hypothesis-driven buckets) and §3
# (8 "negative space" buckets a keyword-driven scan missed the first time).
#
# WHY THIS EXISTS: §3 of the Reality Map documents that a 2026-07-05 capability
# scan found what it was told to look for (§2's 8 buckets), then a SEPARATE,
# manual negative-space sweep found 8 more real clusters the tidy scan missed
# entirely. That sweep was a one-time, human-run event. Nothing prevented the
# next capability audit from repeating the same tunnel-vision mistake. This
# registry + scripts/dev/capability-drift-scan.py is the mechanized backstop:
# instead of re-discovering blind spots by chance, unattributed LOC clusters
# above a threshold get flagged automatically.
#
# DELIBERATE OMISSION: §3's "also uncovered" list (chump-gh-app,
# chump-integrator, chump-policy, chump-reviewer-routing, chump-cancel-registry,
# ast-crawler) is NOT registered below on purpose — these are real crates that
# were found but never given a proper bucket home. Leaving them unregistered
# means the first run of capability-drift-scan.py should flag them, which is
# the built-in self-test that the scanner actually works on real drift rather
# than a synthetic fixture.
#
# Format: each bucket is a name + a list of glob patterns (relative to repo
# root, fnmatch-style) that belong to it. A path matching zero buckets above
# the LOC threshold is what the scanner flags.

buckets:
  # --- §2: the 8 tidy, hypothesis-driven buckets ---
  - name: multi_agent_coordination
    source: "CODEBASE_REALITY_MAP.md §2"
    globs:
      - "crates/chump-coord/**"
      - "crates/chump-agent-lease/**"
      - "crates/chump-orchestrator/**"
      - "src/atomic_claim.rs"

  - name: llm_infrastructure

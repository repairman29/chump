<text x="38" y="557" fill="#5b5a4e" font-size="12">coordination by artifact — and the human gate</text>
<rect x="360" y="545" width="14" height="14" rx="3" fill="#a9c6e8" stroke="#3f608a"/>
<text x="382" y="557" fill="#5b5a4e" font-size="12">one agent per task, linear inside</text>

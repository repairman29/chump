<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ct cd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<title id="ct">ChumpOS: the registry-coordinated factory</title>
<desc id="cd">Work flows from intake into a central registry of gaps. Parallel workers each claim one gap and run it linearly through a shared gate wall into origin main, then publishing, then Jeff at ring zero who holds the irreversible click, then people. Feedback from people returns to intake via holler and posse.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b5a4e"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" fill="#f3efe2"/>
<text x="16" y="34" fill="#2b2b26" font-size="20" font-weight="600">CHUMPOS — THE REGISTRY-COORDINATED FACTORY</text>
<text x="16" y="58" fill="#5b5a4e" font-size="13">distributed like a fleet, disciplined like a single agent</text>
<text x="482" y="122" fill="#5b5a4e" font-size="12">parallel across tasks — never within</text>
<g>

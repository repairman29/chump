<text x="430" y="270" fill="#5b5a4e" font-size="11">claim</text>
<text x="890" y="385" fill="#5b5a4e" font-size="11">ship</text>
<text x="140" y="450" fill="#5b5a4e" font-size="11">holler · posse findings</text>

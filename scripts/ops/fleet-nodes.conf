# fleet-nodes.conf — node topology for fleet-health-sentinel.sh --fleet grade.
# RESILIENT-1052.
#
# TAB-separated: <name>\t<ssh_target>\t<ssh_opts>
#   name        node id (matches `hostname` on that node)
#   ssh_target  user@host for the --fleet grader to reach it; EMPTY for the
#               host the grader itself runs on (it reads the local heartbeat).
#   ssh_opts    extra ssh options (identity file, etc.), space-separated.
#
# NOTE (2026-09-07): the Oracle nodes cannot SSH each other (cuphead has no key
# for mugman), so today the --fleet grade runs from the BOARD, which holds the
# oracle key and can reach both. Once the fleet-server is healthy the grade
# moves server-side via the sentinel-heartbeat POST (no board dependency).
# closetjunky is reached via the operator's ~/.ssh/config alias.
cuphead	ubuntu@161.153.42.233	-i ~/.ssh/oracle_ftue_node -o IdentitiesOnly=yes
mugman	ubuntu@137.131.14.145	-i ~/.ssh/oracle_ftue_node -o IdentitiesOnly=yes
closetjunky	closetjunky

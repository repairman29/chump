<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="stone">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Chump — Sovereign Operator Cockpit</title>
  <style>
    /* ── Design tokens ──────────────────────────────────────────────────── */
    :root {
      --bg:            #141412;
      --bg-surface:    #1c1c19;
      --bg-elevated:   #252420;
      --text:          #f2f0ea;
      --text-secondary:#9c988e;
      --accent:        #4ca372;
      --accent-dim:    rgba(76, 163, 114, 0.15);
      --border:        rgba(242, 240, 234, 0.11);
      --success:       #3fb96d;
      --warn:          #e09b36;
      --error:         #e5534b;
      --radius:        10px;
      --radius-sm:     6px;
      --nav-width:     64px;
      --header-h:      52px;
      --safe-top:      env(safe-area-inset-top, 0px);
      --safe-bottom:   env(safe-area-inset-bottom, 0px);
      --safe-left:     env(safe-area-inset-left, 0px);
    }

    /* INFRA-1280 Sub-gap 4: Warm-Stone & Sovereign Forest light theme (PRODUCT-372). */
    html[data-theme="light"] {
      --bg:            #f5f4f0;
      --bg-surface:    #ffffff;
      --bg-elevated:   #eceae3;
      --text:          #161816;
      --text-secondary:#595d57;
      --accent:        #22402f;
      --accent-dim:    rgba(34, 64, 47, 0.10);
      --border:        #e2dfd7;
      --success:       #246b42;
      --warn:          #b26b15;
      --error:         #b83227;
    }

    /* INFRA-1280 Sub-gap 4: WCAG-AAA high-contrast variant. */
    html[data-theme="high-contrast"] {
      --bg:            #000000;
      --bg-surface:    #000000;
      --bg-elevated:   #1a1a1a;
      --text:          #ffffff;
      --text-secondary:#e0e0e0;
      --accent:        #66c2ff;
      --accent-dim:    rgba(102, 194, 255, 0.30);
      --border:        rgba(255,255,255,0.40);
      --success:       #6ef07a;
      --warn:          #ffd166;
      --error:         #ff8a80;
    }

    /* PRODUCT-372: Extended semantic palette for Warm-Obsidian & Warm-Stone parity with /site/. */
    :root {
      --font-display:    "Host Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-sans:       "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono:       "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
      --on-accent:       #ffffff;
      --on-dark:         #111110;
      --bronze:          #d1a75c;
      --bronze-dim:      rgba(209, 167, 92, 0.16);
      --border-strong:   rgba(242, 240, 234, 0.20);
      --tone-ok-bg:      rgba(63, 185, 109, 0.14);
      --tone-ok-border:  rgba(63, 185, 109, 0.32);
      --tone-warn-bg:    rgba(224, 155, 54, 0.14);
      --tone-warn-border:rgba(224, 155, 54, 0.34);
      --tone-err-bg:     rgba(229, 83, 75, 0.14);
      --tone-err-border: rgba(229, 83, 75, 0.34);
      --tone-info-bg:    rgba(92, 156, 229, 0.14);
      --tone-info-fg:    #7cb7ff;
      --tone-purple-bg:  rgba(176, 114, 245, 0.15);
      --tone-purple-fg:  #c99eff;
      --shadow-card:     0 1px 2px rgba(0, 0, 0, 0.28);
      --shadow-elevated: 0 12px 32px rgba(0, 0, 0, 0.45);
      --overlay-scrim:   rgba(10, 10, 9, 0.62);
    }

    html[data-theme="light"] {
      --on-accent:       #ffffff;
      --on-dark:         #ffffff;
      --bronze:          #966f2f;
      --bronze-dim:      rgba(150, 111, 47, 0.12);
      --border-strong:   #cfcac0;
      --tone-ok-bg:      rgba(36, 107, 66, 0.09);
      --tone-ok-border:  rgba(36, 107, 66, 0.26);
      --tone-warn-bg:    rgba(178, 107, 21, 0.10);
      --tone-warn-border:rgba(178, 107, 21, 0.28);
      --tone-err-bg:     rgba(184, 50, 39, 0.09);
      --tone-err-border: rgba(184, 50, 39, 0.26);
      --tone-info-bg:    rgba(34, 64, 47, 0.08);
      --tone-info-fg:    #22402f;
      --tone-purple-bg:  rgba(108, 68, 156, 0.10);
      --tone-purple-fg:  #5b3787;
      --shadow-card:     0 1px 2px rgba(22, 24, 22, 0.04);
      --shadow-elevated: 0 14px 36px rgba(22, 24, 22, 0.12);
      --overlay-scrim:   rgba(22, 24, 22, 0.42);
    }

    html[data-theme="high-contrast"] {
      --on-accent:       #000000;
      --on-dark:         #000000;
      --bronze:          #ffd166;
      --bronze-dim:      rgba(255, 209, 102, 0.25);
      --border-strong:   #ffffff;
      --tone-ok-bg:      rgba(110, 240, 122, 0.22);
      --tone-ok-border:  #6ef07a;
      --tone-warn-bg:    rgba(255, 209, 102, 0.22);
      --tone-warn-border:#ffd166;
      --tone-err-bg:     rgba(255, 138, 128, 0.24);
      --tone-err-border: #ff8a80;
      --tone-info-bg:    rgba(102, 194, 255, 0.24);
      --tone-info-fg:    #66c2ff;
      --tone-purple-bg:  rgba(255, 255, 255, 0.18);
      --tone-purple-fg:  #ffffff;
      --shadow-card:     none;
      --shadow-elevated: none;
      --overlay-scrim:   rgba(0, 0, 0, 0.82);
    }

    /* ── Reset & Shell Typography ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.5;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    /* ── Top Command Header (#app-header <= 4 direct children) ──────────── */
    #app-header {
      min-height: calc(var(--header-h) + var(--safe-top));
      padding: var(--safe-top) 20px 0 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-surface);
      position: relative;
      z-index: 20;
      flex-shrink: 0;
    }
    #app-title {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-right: auto;
    }
    .brand-glyph {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--on-accent);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      flex-shrink: 0;
    }
    .brand-divider {
      color: var(--border-strong);
      font-weight: 400;
    }
    .brand-sub {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    chump-heartbeat {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .hb-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .hb-dot.online  { background: var(--success); }
    .hb-dot.offline { background: var(--error); }
    .hb-text { vertical-align: middle; }

    .header-utilities {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .hdr-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
      white-space: nowrap;
    }
    .hdr-btn:hover {
      background: var(--bg-elevated);
      color: var(--text);
      border-color: var(--border-strong);
    }
    .hdr-btn-site {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: var(--accent-dim);
      font-weight: 600;
    }
    .hdr-btn-site:hover {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
    }

    /* ── Repo switcher (INFRA-992) ────────────────────────────────────────── */
    chump-repo-switcher {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    chump-repo-switcher:empty { display: none; }
    chump-repo-switcher .repo-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text);
      max-width: 220px;
    }
    chump-repo-switcher .repo-chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    chump-repo-switcher .repo-switch-btn {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    chump-repo-switcher .repo-switch-btn:hover {
      background: var(--bg-elevated);
      color: var(--text);
    }
    chump-repo-switcher .repo-dialog {
      position: absolute;
      top: 36px;
      right: 0;
      width: 360px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow-elevated);
      z-index: 1000;
      font-size: 12px;
      color: var(--text);
    }
    chump-repo-switcher .repo-dialog-head { font-size: 13px; margin-bottom: 8px; }
    chump-repo-switcher .repo-dialog-label { display: block; margin: 4px 0 8px 0; color: var(--text-secondary); }
    chump-repo-switcher .repo-dialog-path {
      width: 100%;
      margin-top: 4px;
      padding: 7px 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-mono);
    }
    chump-repo-switcher .repo-dialog-warn {
      background: var(--tone-warn-bg);
      color: var(--warn);
      border-left: 3px solid var(--warn);
      padding: 6px 8px;
      margin: 8px 0;
      font-size: 11px;
      line-height: 1.4;
    }
    chump-repo-switcher .repo-dialog-error {
      background: var(--tone-err-bg);
      color: var(--error);
      border-left: 3px solid var(--error);
      padding: 6px 8px;
      margin: 8px 0;
      font-size: 11px;
      line-height: 1.4;
    }
    chump-repo-switcher .repo-dialog-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 10px;
    }
    chump-repo-switcher .repo-dialog-save,
    chump-repo-switcher .repo-dialog-cancel {
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    chump-repo-switcher .repo-dialog-save {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--on-accent);
    }
    chump-repo-switcher .repo-dialog-cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    /* ── Offline banner (hidden unless body.offline) ────────────────────── */
    #offline-banner {
      display: none;
      background: var(--tone-warn-bg);
      color: var(--warn);
      border-bottom: 1px solid var(--tone-warn-border);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 6px 16px;
      flex-shrink: 0;
    }
    body.offline #offline-banner { display: block; }

    /* ── Doctor banner — compact collapsible advisory bar (INFRA-990) ──── */
    chump-doctor-banner {
      display: none;
      background: var(--tone-warn-bg);
      color: var(--text);
      border-bottom: 1px solid var(--tone-warn-border);
      font-size: 12px;
      padding: 6px 20px;
      flex-shrink: 0;
    }
    chump-doctor-banner .doctor-banner-inner {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    chump-doctor-banner .doctor-banner-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    chump-doctor-banner .doctor-banner-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg-surface);
      border: 1px solid var(--tone-warn-border);
      color: var(--warn);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    chump-doctor-banner .doctor-banner-head {
      font-size: 12px;
      color: var(--text);
      flex: 1;
      min-width: 180px;
    }
    chump-doctor-banner .doctor-banner-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    chump-doctor-banner .doctor-details-toggle {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px 9px;
      font-size: 11px;
      cursor: pointer;
    }
    chump-doctor-banner .doctor-details-toggle:hover {
      background: var(--bg-surface);
      color: var(--text);
    }
    chump-doctor-banner .doctor-configure {
      background: var(--accent);
      color: var(--on-accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    chump-doctor-banner .doctor-banner-list {
      margin: 2px 0 4px 0;
      padding: 8px 12px;
      list-style: none;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 11px;
      max-height: 130px;
      overflow-y: auto;
    }
    chump-doctor-banner .doctor-banner-list[hidden] { display: none; }
    chump-doctor-banner .doctor-banner-list li { margin: 3px 0; line-height: 1.45; word-break: break-word; }
    chump-doctor-banner .fix-hint { color: var(--text-secondary); }
    chump-doctor-banner .doctor-banner-toast {
      color: var(--success);
      text-align: center;
      font-weight: 600;
    }

    /* ── Auth-fallback toast (INFRA-991) ─────────────────────────────────── */
    chump-auth-toast {
      display: none;
      position: fixed;
      top: 62px;
      right: 20px;
      max-width: 380px;
      background: var(--bg-surface);
      color: var(--text);
      border: 1px solid var(--tone-warn-border);
      border-left: 3px solid var(--warn);
      border-radius: var(--radius);
      box-shadow: var(--shadow-elevated);
      padding: 12px 14px;
      font-size: 12.5px;
      z-index: 9999;
    }
    chump-auth-toast .auth-toast-head { font-size: 13px; margin-bottom: 4px; }
    chump-auth-toast .auth-toast-counter {
      font-size: 11px;
      font-weight: normal;
      margin-left: 6px;
      color: var(--text-secondary);
    }
    chump-auth-toast .auth-toast-body { margin: 4px 0 10px 0; line-height: 1.4; color: var(--text-secondary); }
    chump-auth-toast .auth-toast-actions { display: flex; gap: 8px; }
    chump-auth-toast .auth-toast-reenter {
      background: var(--accent);
      color: var(--on-accent);
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 5px 11px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    chump-auth-toast .auth-toast-dismiss {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 11px;
      font-size: 11.5px;
      cursor: pointer;
    }

    /* ── First-run wizard — compact collapsible readiness strip (PRODUCT-108) */
    chump-first-run-wizard { display: block; flex-shrink: 0; }
    chump-first-run-wizard[hidden] { display: none; }
    chump-first-run-wizard .frw-shell {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 20px;
      position: relative;
      z-index: 12;
    }
    chump-first-run-wizard .frw-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    chump-first-run-wizard .frw-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    chump-first-run-wizard .frw-pill {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
    }
    chump-first-run-wizard .frw-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      flex: 1;
      min-width: 180px;
    }
    chump-first-run-wizard .frw-header-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    chump-first-run-wizard .frw-expand,
    chump-first-run-wizard .frw-dismiss {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
    }
    chump-first-run-wizard .frw-expand:hover,
    chump-first-run-wizard .frw-dismiss:hover {
      color: var(--text);
      background: var(--bg-elevated);
    }
    chump-first-run-wizard .frw-steps {
      list-style: none;
      padding: 10px 0 4px 0;
      margin: 8px 0 0 0;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 8px;
    }
    chump-first-run-wizard .frw-steps[hidden] { display: none; }
    chump-first-run-wizard .frw-step {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
    }
    chump-first-run-wizard .frw-step-current {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    chump-first-run-wizard .frw-step-icon {
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 20px;
      text-align: center;
      font-weight: 700;
    }
    chump-first-run-wizard .frw-step-done    .frw-step-icon { color: var(--success); }
    chump-first-run-wizard .frw-step-skipped .frw-step-icon { color: var(--text-secondary); }
    chump-first-run-wizard .frw-step-current .frw-step-icon { color: var(--accent); }
    chump-first-run-wizard .frw-step-pending .frw-step-icon { color: var(--text-secondary); }
    chump-first-run-wizard .frw-step-body { min-width: 0; }
    chump-first-run-wizard .frw-step-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }
    chump-first-run-wizard .frw-step-label {
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
    }
    chump-first-run-wizard .frw-step-hint {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
      line-height: 1.35;
    }
    chump-first-run-wizard .frw-step-actions {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    chump-first-run-wizard .frw-cta {
      background: var(--accent);
      color: var(--on-accent);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    chump-first-run-wizard .frw-skip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 11px;
    }

    /* ── Workspace Body & Architectural Command Rail (<chump-nav>) ──────── */
    #app-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    chump-nav {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 6px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
    }
    chump-nav .nav-cadences {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    chump-nav .nav-cadence {
      border: none;
      background: transparent;
      border-radius: 4px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.14s, color 0.14s, box-shadow 0.14s;
      white-space: nowrap;
    }
    chump-nav .nav-cadence:hover {
      color: var(--text);
    }
    chump-nav .nav-cadence[aria-current="page"] {
      background: var(--bg-surface);
      color: var(--accent);
      box-shadow: var(--shadow-card);
    }
    chump-nav .nav-kbd {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 500;
      padding: 0 4px;
      border-radius: 3px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      line-height: 1.4;
    }
    chump-nav .nav-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }
    chump-nav .nav-subtabs {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    chump-nav .nav-subtabs:empty { display: none; }
    chump-nav .nav-item {
      border: 1px solid transparent;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      padding: 5px 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 500;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
      white-space: nowrap;
      position: relative;
    }
    chump-nav .nav-item:hover {
      background: var(--bg-elevated);
      color: var(--text);
    }
    chump-nav .nav-item[aria-current="page"] {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: var(--accent-dim);
      font-weight: 600;
    }
    chump-nav .nav-icon {
      font-size: 12px;
      line-height: 1;
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    chump-nav .nav-label {
      letter-spacing: -0.01em;
    }

    @media (max-width: 720px) {
      #app-header { padding: var(--safe-top) 12px 0 12px; gap: 8px; }
      .brand-sub, .brand-divider { display: none; }
      chump-nav {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 6px 12px;
      }
      chump-nav .nav-divider { display: none; }
      chump-nav .nav-cadences { justify-content: space-between; }
      chump-nav .nav-cadence { flex: 1; justify-content: center; }
      chump-nav .nav-subtabs { overflow-x: auto; padding-bottom: 2px; }
    }

    /* PRODUCT-094: notification badge */
    .notif-badge {
      background: var(--error);
      color: var(--on-accent);
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 999px;
      min-width: 15px;
      text-align: center;
      pointer-events: none;
    }

    /* ── PRODUCT-100: status pill + toast + offline retry ───────────────── */
    .chump-status-pill {
      display: none;
    }
    #chump-toast-container {
      position: fixed;
      bottom: 44px;
      right: 16px;
      z-index: 9100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
    }
    .chump-error-toast {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--bg-surface);
      border: 1px solid var(--tone-err-border);
      border-left: 3px solid var(--error);
      box-shadow: var(--shadow-elevated);
      color: var(--text);
      font-size: 12.5px;
    }
    .toast-msg code { font-family: var(--font-mono); font-size: 11px; color: var(--error); }
    .toast-retry, .toast-dismiss {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
      padding: 3px 8px;
      font-size: 11.5px;
      flex-shrink: 0;
    }
    .toast-dismiss { border: none; background: transparent; color: var(--text-secondary); font-size: 15px; padding: 0 4px; }

    #chump-offline-banner {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9200;
      background: var(--tone-err-bg);
      color: var(--error);
      border-bottom: 1px solid var(--tone-err-border);
      text-align: center;
      padding: 8px 16px;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #chump-offline-retry {
      background: var(--bg-surface);
      border: 1px solid var(--tone-err-border);
      border-radius: var(--radius-sm);
      color: var(--error);
      cursor: pointer;
      padding: 3px 10px;
      font-size: 11.5px;
    }

    /* ── Main content ───────────────────────────────────────────────────── */
    #main-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* ── Shared View Chrome ─────────────────────────────────────────────── */
    .view-panel {
      padding: 20px 24px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }
    .view-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 4px;
    }
    .view-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
      flex-shrink: 0;
    }
    .view-header h2 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }
    .view-subtitle { color: var(--text-secondary); font-size: 12.5px; }
    .placeholder {
      color: var(--text-secondary);
      font-size: 13px;
      padding: 32px 24px;
      text-align: center;
    }

    /* ── Gap Queue & Filter Controls ────────────────────────────────────── */
    .gap-filter-clear {
      padding: 5px 10px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 11.5px;
    }
    .gap-filter-clear:hover { color: var(--text); background: var(--bg-elevated); }
    .gap-search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 24px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .gap-search-bar input[type=search] {
      flex: 1 1 200px;
      min-width: 140px;
      padding: 7px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    .gap-search-bar select {
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    .gap-filter-ac {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .gap-queue-stats {
      display: flex;
      gap: 20px;
      padding: 12px 24px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
    }
    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .stat-value {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .gap-list {
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1440px;
    }
    .gap-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
    }
    .gap-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .gap-id {
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--text);
    }
    .gap-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
    }
    .badge-success { background: var(--tone-ok-bg); color: var(--success); }
    .badge-warn    { background: var(--tone-warn-bg); color: var(--warn); }
    .badge-error   { background: var(--tone-err-bg); color: var(--error); }
    .gap-priority {
      font-size: 11px;
      color: var(--text-secondary);
      margin-left: auto;
      font-family: var(--font-mono);
    }
    .gap-pillar {
      font-size: 9.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 999px;
    }
    .gap-pillar-effective  { background: var(--tone-info-bg); color: var(--tone-info-fg); }
    .gap-pillar-credible   { background: var(--bronze-dim); color: var(--bronze); }
    .gap-pillar-resilient  { background: var(--tone-purple-bg); color: var(--tone-purple-fg); }
    .gap-pillar-zero-waste { background: var(--tone-ok-bg); color: var(--success); }
    .gap-pillar-mission    { background: var(--tone-err-bg); color: var(--error); }
    .gap-domain {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }
    .gap-ac, .gap-deps {
      font-size: 10.5px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      padding: 2px 4px;
    }
    .gap-deps { color: var(--bronze); }
    .gap-lease {
      font-size: 11.5px;
      color: var(--bronze);
      font-family: var(--font-mono);
      margin-top: 2px;
    }
    .gap-embed { margin-top: 8px; min-height: 0; }
    .gap-embed:empty { display: none; }
    .gap-acp-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 11px;
    }
    .gap-acp-link,
    .gap-acp-copy {
      color: var(--text-secondary);
      text-decoration: none;
      padding: 3px 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      cursor: pointer;
      font-size: 11px;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .gap-acp-link:hover,
    .gap-acp-copy:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    .gap-acp-copy-success {
      background: var(--tone-ok-bg);
      color: var(--success);
      border-color: var(--tone-ok-border);
    }
    .gap-title {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.45;
      margin-bottom: 6px;
    }
    .gap-error {
      font-size: 12px;
      color: var(--warn);
      background: var(--tone-warn-bg);
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }
    .gap-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .gap-claim-btn,
    .gap-work-btn,
    .gap-retry-btn,
    .gap-status-btn {
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
    }
    .gap-claim-btn,
    .gap-work-btn {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }

    /* ── View: Tasks, Memory, Agents ────────────────────────────────────── */
    .task-list, .memory-list, .agents-list {
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 1440px;
    }
    .task-card, .memory-card, .agent-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
    }
    .task-card-header, .agent-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .task-status, .agent-ci-badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
    }
    .task-status.running, .ci-success { background: var(--tone-ok-bg); color: var(--success); }
    .task-status.done                 { background: var(--accent-dim); color: var(--accent); }
    .task-status.error, .ci-failure   { background: var(--tone-err-bg); color: var(--error); }
    .ci-pending                       { background: var(--tone-warn-bg); color: var(--warn); }
    .task-id, .agent-gap-id {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      font-family: var(--font-mono);
    }
    .task-desc, .agent-gap-title { font-size: 13.5px; color: var(--text); line-height: 1.45; }
    .memory-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    .agent-pr-link {
      font-size: 11.5px;
      font-family: var(--font-mono);
      color: var(--accent);
      text-decoration: none;
      margin-left: auto;
    }
    .agent-meta, .agent-worktree {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      margin-top: 4px;
    }
    .agents-refresh-note {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
      padding: 8px 0 4px;
    }

    /* ── View: Audit (PRODUCT-111) ──────────────────────────────────────── */
    chump-view-audit { display: block; padding: 20px 24px; max-width: 1440px; }
    chump-view-audit .audit-toolbar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      padding: 8px 0 12px; margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    chump-view-audit .audit-chips { display: inline-flex; gap: 5px; }
    chump-view-audit .audit-chip {
      background: var(--bg-surface); border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 10px; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 11.5px;
    }
    chump-view-audit .audit-chip:hover { color: var(--text); background: var(--bg-elevated); }
    chump-view-audit .audit-chip[aria-pressed="true"] {
      background: var(--accent-dim); color: var(--accent); border-color: var(--accent);
    }
    chump-view-audit .audit-search {
      flex: 1; min-width: 180px;
      padding: 6px 10px; background: var(--bg-surface);
      border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius-sm); font-size: 12.5px;
    }
    chump-view-audit .audit-export,
    chump-view-audit .audit-clear {
      background: var(--bg-surface); border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 5px 12px; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 11.5px;
    }
    chump-view-audit .audit-stats {
      padding: 6px 0; font-size: 11.5px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    chump-view-audit .audit-stat { color: var(--text); font-weight: 600; }
    chump-view-audit .audit-stat-sep { margin: 0 8px; opacity: 0.4; }
    chump-view-audit .audit-table {
      width: 100%; border-collapse: collapse; font-size: 12.5px;
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius);
    }
    chump-view-audit .audit-table thead th {
      position: sticky; top: 0; z-index: 1;
      background: var(--bg-elevated);
      text-align: left; padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-secondary);
    }
    chump-view-audit .audit-row { cursor: pointer; }
    chump-view-audit .audit-row:hover { background: var(--bg-elevated); }
    chump-view-audit .audit-row td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    chump-view-audit .audit-cell-ts { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; }
    chump-view-audit .audit-kind { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 6px; border-radius: 4px; }
    chump-view-audit .audit-kind-tool_approval { background: var(--tone-info-bg); color: var(--tone-info-fg); }
    chump-view-audit .audit-kind-cos           { background: var(--tone-purple-bg); color: var(--tone-purple-fg); }
    chump-view-audit .audit-pill {
      background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
      padding: 1px 6px; border-radius: 4px; cursor: pointer; font-size: 11px;
      font-family: var(--font-mono);
    }
    chump-view-audit .audit-cell-summary { max-width: 480px; overflow: hidden; text-overflow: ellipsis; }
    chump-view-audit .audit-outcome { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    chump-view-audit .audit-outcome-ok   { background: var(--tone-ok-bg); color: var(--success); }
    chump-view-audit .audit-outcome-bad  { background: var(--tone-err-bg); color: var(--error); }
    chump-view-audit .audit-outcome-info { background: var(--bg-elevated); color: var(--text-secondary); }
    chump-view-audit .audit-row-expansion td { background: var(--bg-elevated); padding: 12px; }
    chump-view-audit .audit-row-expansion pre {
      margin: 0; font-size: 11px; color: var(--text-secondary);
      max-height: 320px; overflow: auto; font-family: var(--font-mono);
    }

    /* ── Cost ceiling inputs + 402 kill-switch modal (PRODUCT-113) ──────── */
    .cost-threshold {
      display: flex; flex-direction: column; gap: 4px;
    }
    .cost-threshold-label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-secondary);
    }
    .cost-threshold input[type="number"] {
      padding: 6px 8px; background: var(--bg);
      border: 1px solid var(--border); color: var(--text);
      border-radius: var(--radius-sm); font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .cost-threshold input[type="number"]:focus {
      outline: 2px solid var(--accent); outline-offset: 1px;
    }
    .cost-kill-modal {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--overlay-scrim);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .cost-kill-modal-shell {
      background: var(--bg-surface); color: var(--text);
      border: 2px solid var(--error);
      border-radius: var(--radius);
      padding: 22px 24px;
      max-width: 480px;
      box-shadow: var(--shadow-elevated);
    }
    .cost-kill-title {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 700;
      color: var(--error);
      margin-bottom: 10px;
    }
    .cost-kill-msg { font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
    .cost-kill-msg strong { color: var(--error); }
    .cost-kill-actions { display: flex; gap: 8px; margin-bottom: 8px; }
    .cost-kill-config {
      background: var(--accent); color: var(--on-accent);
      padding: 7px 14px; border: none; border-radius: var(--radius-sm);
      cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .cost-kill-dismiss {

    chump-view-roadmap .roadmap-blockers          { margin-top: 8px; padding: 6px 10px; background: var(--tone-err-bg); color: var(--error); border-radius: var(--radius-sm); font-size: 12px; }

    chump-view-fleet-health .fh-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    chump-view-fleet-health .fh-panel {

      border-radius: var(--radius);
      padding: 14px 16px;

    chump-view-fleet-health .fh-panel-footnote { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-secondary); }
    chump-view-fleet-health .fh-pillar-quadrant { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    chump-view-fleet-health .fh-pillar-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; border-radius: var(--radius-sm); background: var(--bg-elevated); }
    chump-view-fleet-health .fh-pillar-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
    chump-view-fleet-health .fh-pillar-grade { font-size: 28px; font-weight: 700; font-family: var(--font-mono); color: var(--text); margin: 4px 0; }

    chump-view-fleet-health .fh-pillar-grade-b { color: var(--accent); }

    chump-view-fleet-health .fh-kpi-value { font-size: 22px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    chump-view-fleet-health .fh-kpi-value.fh-kpi-warn { color: var(--warn); }
    chump-view-fleet-health .fh-kpi-value.fh-kpi-red  { color: var(--error); }
    chump-view-fleet-health .fh-kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-secondary); margin-top: 2px; }
    chump-view-fleet-health .fh-slo-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
    chump-view-fleet-health .fh-slo-row { display: grid; grid-template-columns: 1fr auto 2fr; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: var(--radius-sm); font-size: 12px; }
    chump-view-fleet-health .fh-slo-ok   { background: var(--tone-ok-bg); }
    chump-view-fleet-health .fh-slo-warn { background: var(--tone-warn-bg); }

    }

    chump-view-coord .coord-panels { display: flex; flex-direction: column; gap: 16px; }
    chump-view-coord .coord-panel { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    chump-view-coord .coord-panel-header { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
    chump-view-coord .coord-panel-header h3 { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; }
    chump-view-coord .coord-stat { font-size: 11px; color: var(--text-secondary); font-variant-numeric: tabular-nums; background: var(--bg-elevated); padding: 2px 8px; border-radius: 999px; }
    chump-view-coord .coord-session-picker { font-size: 11px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
    chump-view-coord .coord-session-picker select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px 8px; font-size: 11px; font-family: var(--font-mono); }
    chump-view-coord .coord-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow-y: auto; }
    chump-view-coord .coord-row { display: grid; grid-template-columns: 56px 100px auto 1fr; gap: 8px; align-items: baseline; padding: 5px 4px; font-size: 12px; border-bottom: 1px solid var(--border); }
    chump-view-coord .coord-row:hover { background: var(--bg-elevated); }
    chump-view-coord .coord-row-ts,
    chump-view-coord .coord-row-from,
    chump-view-coord .coord-row-gap { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
    chump-view-coord .coord-row-kind { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 4px; background: var(--bg-elevated); color: var(--text-secondary); }
    chump-view-coord .coord-row-body { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    chump-view-coord .coord-row-class-dirty            { background: var(--tone-err-bg); color: var(--error); }
    chump-view-coord .coord-row-class-blocked-ci       { background: var(--tone-warn-bg); color: var(--warn); }
    chump-view-coord .coord-row-class-orphan-disarmed  { background: var(--tone-purple-bg); color: var(--tone-purple-fg); }
    chump-view-coord .coord-row-class-base-modified    { background: var(--tone-info-bg); color: var(--tone-info-fg); }
    chump-view-coord .coord-row-class-clean-not-merged { background: var(--tone-ok-bg); color: var(--success); }

    chump-view-orchestrator-sessions .orch-sparklines { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    chump-view-orchestrator-sessions .orch-sparkline-fig { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; flex: 1 1 150px; min-width: 140px; max-width: 240px; }
    chump-view-orchestrator-sessions .orch-spark-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 6px; }
    chump-view-orchestrator-sessions .orch-spark-svg { display: block; width: 100%; height: 40px; }
    chump-view-orchestrator-sessions .orch-table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--bg-surface); border: 1px solid var(--border); }
    chump-view-orchestrator-sessions .orch-table thead th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; color: var(--text-secondary); }
    chump-view-orchestrator-sessions .orch-row td { padding: 7px 10px; border-bottom: 1px solid var(--border); }
    chump-view-orchestrator-sessions .orch-sid-btn { background: none; border: none; padding: 0; color: var(--accent); cursor: pointer; font-family: var(--font-mono); font-size: 11px; }
    chump-view-orchestrator-sessions .orch-exit-clean { background: var(--tone-ok-bg); color: var(--success); }
    chump-view-orchestrator-sessions .orch-exit-bad   { background: var(--tone-err-bg); color: var(--error); }
    chump-view-orchestrator-sessions .orch-exit-gray  { background: var(--bg-elevated); color: var(--text-secondary); }
    chump-view-orchestrator-sessions .orch-placeholder { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 48px 16px; color: var(--text-secondary); }

    /* ── Tool approval tray & PR modal ──────────────────────────────────── */
    chump-tool-approval-tray { display: block; flex-shrink: 0; }
    chump-tool-approval-tray .tat-shell[hidden] { display: none; }
    chump-tool-approval-tray .tat-shell {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      border-left: 3px solid var(--warn);
      padding: 10px 20px;
      max-height: 36vh;
      overflow-y: auto;
    }
    chump-tool-approval-tray .tat-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 12px; color: var(--text-secondary); }
    chump-tool-approval-tray .tat-count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 8px; background: var(--warn); color: var(--on-accent); border-radius: 999px; font-size: 11px; font-weight: 700; }
    chump-tool-approval-tray .tat-title { flex: 1; text-transform: uppercase; letter-spacing: 0.04em; }
    chump-tool-approval-tray .tat-batch { display: flex; gap: 6px; }
    chump-tool-approval-tray .tat-batch-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); padding: 4px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 11px; }
    chump-tool-approval-tray .tat-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    chump-tool-approval-tray .tat-row { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
    chump-tool-approval-tray .tat-row-main { display: flex; align-items: baseline; gap: 8px; }
    chump-tool-approval-tray .tat-tool { font-weight: 600; color: var(--text); font-family: var(--font-mono); }
    chump-tool-approval-tray .tat-risk { font-size: 10px; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; }
    chump-tool-approval-tray .tat-risk-low    { background: var(--tone-ok-bg); color: var(--success); }
    chump-tool-approval-tray .tat-risk-medium { background: var(--tone-warn-bg); color: var(--warn); }
    chump-tool-approval-tray .tat-risk-high   { background: var(--tone-err-bg); color: var(--error); }
    chump-tool-approval-tray .tat-actions { display: flex; gap: 6px; }
    chump-tool-approval-tray .tat-btn { padding: 5px 12px; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; font-size: 12px; font-weight: 600; }
    chump-tool-approval-tray .tat-approve { background: var(--accent); color: var(--on-accent); }
    chump-tool-approval-tray .tat-deny { background: transparent; border-color: var(--border); color: var(--text-secondary); }

    .pr-action-modal {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
    }
    .pr-action-modal-overlay { position: absolute; inset: 0; background: var(--overlay-scrim); }
    .pr-action-modal-content {
      position: relative; background: var(--bg-surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow-elevated);
      width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto;
    }
    .pr-action-modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
    .pr-action-modal-close { background: transparent; border: none; font-size: 22px; cursor: pointer; color: var(--text-secondary); }
    .pr-action-modal-body { padding: 16px; }
    .pr-action-modal-textarea {
      width: 100%; padding: 10px; font-size: 13px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: var(--radius-sm); font-family: var(--font-mono); min-height: 100px;
    }
    .pr-action-modal-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 16px; border-top: 1px solid var(--border); }
    .pr-action-modal-cancel, .pr-action-modal-submit { padding: 7px 14px; font-size: 12px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text); }
    .pr-action-modal-submit { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

    /* ── Settings & Cascade Slot Controls ───────────────────────────────── */
    .cascade-slot-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; background: var(--bg-surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 5px;
    }
    .cascade-slot-disabled { opacity: 0.45; }
    .cascade-slot-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
    .cascade-slot-name { font-size: 12px; font-family: var(--font-mono); font-weight: 600; color: var(--text); }
    .cascade-slot-stats { font-size: 10.5px; color: var(--text-secondary); font-family: var(--font-mono); }
    .cascade-badge { font-size: 9.5px; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
    .cascade-badge-err  { background: var(--tone-err-bg); color: var(--error); }
    .cascade-badge-warn { background: var(--tone-warn-bg); color: var(--warn); }
    .cascade-empty { font-size: 12.5px; color: var(--text-secondary); }
    .cascade-toggle { position: relative; display: inline-flex; align-items: center; cursor: pointer; flex-shrink: 0; }
    .cascade-toggle-input { opacity: 0; width: 0; height: 0; position: absolute; }
    .cascade-toggle-track {
      width: 34px; height: 18px; background: var(--border-strong);
      border-radius: 9px; transition: background 0.2s; position: relative;
    }
    .cascade-toggle-track::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--bg-surface); transition: transform 0.2s;
    }
    .cascade-toggle-input:checked + .cascade-toggle-track { background: var(--accent); }
    .cascade-toggle-input:checked + .cascade-toggle-track::after { transform: translateX(16px); }

    .slot-metric-card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .slot-metric-header { display: flex; justify-content: space-between; align-items: center; }
    .slot-metric-name { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--text); }
    .slot-metric-last { font-size: 10.5px; color: var(--text-secondary); }
    .slot-metric-stats { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
    .slot-metric-stat { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
    .slot-metric-val { font-size: 16px; font-weight: 700; font-family: var(--font-mono); color: var(--text); }
    .slot-metric-val.accent { color: var(--accent); }
    .slot-metric-val.success { color: var(--success); }
    .slot-metric-label { font-size: 9.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }

    .settings-grid { padding: 20px 24px; display: flex; flex-direction: column; gap: 1px; max-width: 980px; }
    .setting-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 16px; background: var(--bg-surface);
      border: 1px solid var(--border); font-size: 13px;
    }
    .setting-row:first-child { border-radius: var(--radius) var(--radius) 0 0; }
    .setting-row:last-child  { border-radius: 0 0 var(--radius) var(--radius); }
    .setting-label { color: var(--text); font-weight: 500; }
    .setting-value { color: var(--text-secondary); font-family: var(--font-mono); font-size: 11.5px; }
    .model-chip {
      font-size: 11px; font-family: var(--font-mono);
      padding: 3px 8px; background: var(--bg-surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-secondary);
    }

    /* ── Ambient viewer & Bandit regret (INFRA-1198 / INFRA-1559) ───────── */
    chump-ambient-viewer { display: block; font-size: 12px; color: var(--text); position: relative; }
    chump-ambient-viewer .amb-toolbar {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
      padding: 7px 10px; background: var(--bg-surface);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    chump-ambient-viewer .amb-filter-label { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
    chump-ambient-viewer .amb-filter,
    chump-ambient-viewer .amb-gap-filter,
    chump-ambient-viewer .amb-severity-filter,
    chump-ambient-viewer .amb-preset-select,
    chump-ambient-viewer .amb-preset-name {
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 7px; font-size: 11.5px; font-family: var(--font-mono);
    }
    chump-ambient-viewer .amb-filter { min-width: 190px; }
    chump-ambient-viewer .amb-gap-filter { width: 120px; }
    chump-ambient-viewer .amb-preset-name { width: 110px; }
    chump-ambient-viewer .amb-state { margin-left: auto; font-size: 14px; line-height: 1; }
    chump-ambient-viewer .amb-state-live         { color: var(--success); }
    chump-ambient-viewer .amb-state-reconnecting { color: var(--warn); }
    chump-ambient-viewer .amb-state-error        { color: var(--error); }
    chump-ambient-viewer .amb-state-connecting   { color: var(--text-secondary); }
    chump-ambient-viewer .amb-pill {
      position: absolute; top: 56px; right: 16px;
      background: var(--accent); color: var(--on-accent);
      padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600;
      cursor: pointer; box-shadow: var(--shadow-card); z-index: 5;
    }
    chump-ambient-viewer .amb-list {
      list-style: none; margin: 0; padding: 0;
      max-height: calc(100vh - 250px); overflow-y: auto;
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-family: var(--font-mono);
    }
    chump-ambient-viewer .amb-row {
      display: grid; grid-template-columns: 74px 190px 1fr;
      gap: 8px; align-items: baseline; padding: 5px 10px;
      border-bottom: 1px solid var(--border); cursor: pointer;
    }

  <script>
    (function applyInitialChumpTheme() {
      try {
        var raw = localStorage.getItem('chump.prefs.theme') || localStorage.getItem('chump.theme');
        var theme = raw ? JSON.parse(raw) : 'light';
        if (theme !== 'dark' && theme !== 'light' && theme !== 'high-contrast') {
          theme = 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_e) {
        document.documentElement.setAttribute('data-theme', 'light');

  <script>
    window.addEventListener('offline', () => document.body.classList.add('offline'));
    window.addEventListener('online',  () => document.body.classList.remove('offline'));
    if (!navigator.onLine) document.body.classList.add('offline');

    // Header theme switcher + Settings button wiring.
    (function wireHeaderControls() {
      function syncThemeBtn() {
        const btn = document.getElementById('header-theme-toggle');
        if (!btn) return;
        const cur = document.documentElement.getAttribute('data-theme') || 'dark';
        btn.textContent = cur === 'light' ? 'Theme: Stone' : cur === 'high-contrast' ? 'Theme: Contrast' : 'Theme: Obsidian';
      }
      syncThemeBtn();

      if (typeof MutationObserver === 'function') {
        new MutationObserver(syncThemeBtn).observe(document.documentElement, {
          attributes: true,
          attributeFilter: ['data-theme'],
        });
      }

      document.getElementById('header-theme-toggle')?.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = cur === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        if (window.chumpPrefs) {
          window.chumpPrefs.set('theme', next);
        } else {
          try { localStorage.setItem('chump.prefs.theme', JSON.stringify(next)); } catch (_e) {}
        }
        syncThemeBtn();
      });

      document.addEventListener('chump:pref-changed', (e) => {
        if (e.detail && e.detail.key === 'theme') syncThemeBtn();
      });

      document.getElementById('settings-btn')?.addEventListener('click', () => {
        document.dispatchEvent(new CustomEvent('chump:navigate', { detail: 'settings' }));
      });
    })();

    // V1->V2 backward-compat aliases for e2e tests.
    function createTestAliases() {
      let aliased = false;
      const viewChat = document.querySelector('chump-view-chat');
      if (viewChat) {
        const chumpChat = viewChat.querySelector('chump-chat');
        if (chumpChat) {
          const input = chumpChat.shadowRoot?.getElementById('input') || chumpChat.shadowRoot?.getElementById('msg-input');
          if (input) {
            if (input.id !== 'msg-input') input.id = 'msg-input';
            aliased = true;
          }
        }
      }
      const chatNav = document.querySelector('[data-view="chat"]');
      if (chatNav && !chatNav.id) chatNav.id = 'sessions-toggle';
      const settingsNav = document.querySelector('[data-view="settings"]');
      if (settingsNav && !settingsNav.id) settingsNav.id = 'settings-btn';
      return aliased;
    }

    function scheduleTestAliases() {
      if (createTestAliases()) return;
      setTimeout(scheduleTestAliases, 250);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', scheduleTestAliases);
    } else {
      scheduleTestAliases();
    }
  </script>

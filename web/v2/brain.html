<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chump — Brain Graph</title>
  <!-- INFRA-1558: Cytoscape.js force-directed layout over /api/brain/graph.json.
       Standalone dev-debugging tool — deliberately NOT wired into the web/v2
       cadence SPA (app.js); see gap AC #3/#8. -->
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
  <script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
  <script src="https://unpkg.com/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-surface: #141414;
      --bg-elevated: #1e1e1e;
      --text: #f0f0f0;
      --text-secondary: #8a8a8e;
      --border: rgba(255,255,255,0.08);
      --accent: #0a84ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #brain-app { display: flex; height: 100vh; width: 100vw; }
    #cy-container { flex: 1 1 auto; height: 100%; min-width: 0; background: var(--bg); }
    #brain-sidebar { width: 260px; flex: 0 0 auto; border-right: 1px solid var(--border); padding: 12px; overflow-y: auto; }
    #brain-detail { width: 320px; flex: 0 0 auto; border-left: 1px solid var(--border); padding: 12px; overflow-y: auto; }
    h1 { font-size: 14px; margin: 0 0 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
    .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    #brain-status { font-size: 12px; color: var(--text-secondary); margin-top: 16px; }
    .detail-row { font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border); word-break: break-word; }
    #node-title { font-size: 15px; margin-bottom: 8px; }
    .empty-hint { color: var(--text-secondary); font-size: 13px; }
  </style>
</head>
<body>
  <div id="brain-app">
    <aside id="brain-sidebar">
      <h1>Node types</h1>
      <div id="type-filters"></div>
      <h1 style="margin-top:20px;">Relations</h1>
      <div id="relation-legend"></div>
      <div id="brain-status">loading…</div>
    </aside>
    <div id="cy-container"></div>
    <aside id="brain-detail">
      <h1>Selected node</h1>
      <div id="node-detail"><p class="empty-hint">Click a node to inspect its record.</p></div>
    </aside>
  </div>
  <script src="brain.js" type="module"></script>
</body>
</html>

# INFRA-202: sccache as rustc wrapper for fleet worktrees.
# INFRA-2242: mold linker (linux only) + cranelift codegen backend (dev only),
# both availability-gated (INFRA-3660) — only present below if this machine
# actually has the binary/component, so a config generated elsewhere can't
# break a build here.
# INFRA-3660: LOCAL disk cache only (USB on Ubuntu CJ) — no Cloudflare/R2.
# Generated by scripts/setup/install-sccache.sh — do not edit by hand,
# re-run the script if you need to regenerate.
#
# .gitignore'd because per-machine: a CI runner without sccache would
# break here.
#
# Linux / Docker cross-build gotcha (INFRA-2104 / INFRA-2105):
#   This rustc-wrapper breaks `cargo build` inside containers that don't
#   have sccache on PATH. To cross-build chump-coord for Linux without
#   the env-var dance, use:
#       bash scripts/dev/cross-build-linux.sh
#   It sets CARGO_BUILD_RUSTC_WRAPPER="" automatically and uses an
#   isolated target dir so failed runs don't poison state.
[build]
# INFRA-481: shared target-dir so linked worktrees don't each build multi-GB target/ trees.
target-dir = "/home/jeff/Projects/chump/target"
rustc-wrapper = "sccache"

# INFRA-2242: mold linker — Linux-only (macOS doesn't have mold by default;
# ld64 is already fast on Apple Silicon). Gated on `command -v mold` at
# generation time (INFRA-3660) so this block is only written when the
# binary is actually present. Drops link phase 10-15% on warm rebuilds.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[env]
# Cache size cap — see CACHE_SIZE selection comment in install-sccache.sh.
# Tune via $SCCACHE_CACHE_SIZE if your machine is differently constrained.
SCCACHE_CACHE_SIZE = "4G"
# LOCAL disk cache (INFRA-3660 — USB-backed on Ubuntu CJ). Never a cloud
# path (no Cloudflare/R2). Override by re-running with SCCACHE_DIR=/path.
SCCACHE_DIR = "/mnt/cjdata2/sccache"

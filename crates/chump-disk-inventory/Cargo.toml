[package]
name = "chump-disk-inventory"
version = "0.1.0"
edition = "2021"
description = "META-128/C2 disk-inventory daemon — polls df + per-path du, snapshots to disk-inventory.json, publishes to NATS (INFRA-2193)"
repository = "https://github.com/repairman29/chump"
license = "AGPL-3.0-only"
keywords = ["agent", "fleet", "disk", "inventory", "nats"]
categories = ["development-tools"]

[[bin]]
name = "chump-disk-inventory-daemon"
path = "src/main.rs"

[lib]
name = "chump_disk_inventory"
path = "src/lib.rs"

[dependencies]
anyhow      = "1.0"
async-nats  = "0.50"
chrono      = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chump-ambient-cli = { path = "../ambient-cli" }
glob        = "0.3"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1.0"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

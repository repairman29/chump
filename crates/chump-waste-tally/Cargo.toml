[package]
name = "chump-waste-tally"
version = "0.1.0"
edition = "2021"
description = "ChumpOS waste-tally reports: fleet-wide token/time/USD waste aggregation from ambient.jsonl plus PR close-reason classification. Extracted from the bin crate (EFFECTIVE-411 build-speed) so it compiles + caches independently of the 190k-line binary. Per-model pricing is injected by the bin at startup via set_cost_fn (keeps this a dependency-free clean leaf)."
repository = "https://github.com/repairman29/chump"
license = "AGPL-3.0-only"

[dependencies]
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[lints]
workspace = true

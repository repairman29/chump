[package]
name = "chump-inventory"
version = "0.1.0"
edition = "2021"
description = "Fleet inventory + tech-debt review-only audit DB (extracted from the chump bin, EFFECTIVE-401)."
repository = "https://github.com/repairman29/chump"
homepage = "https://github.com/repairman29/chump/tree/main/crates/chump-inventory"
license = "AGPL-3.0-only"

[lib]
name = "chump_inventory"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.118", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tracing = "0.1"

[dev-dependencies]
serial_test = "4"
tempfile = "3"

[lints]
workspace = true

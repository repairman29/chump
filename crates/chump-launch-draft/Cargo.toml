[package]
name = "chump-launch-draft"
version = "0.1.0"
edition = "2021"
description = "Launch draft data model + persistence (EFFECTIVE-1508, EFFECTIVE-365 slice)."
repository = "https://github.com/repairman29/chump"
homepage = "https://github.com/repairman29/chump/tree/main/crates/chump-launch-draft"
license = "AGPL-3.0-only"

[lib]
name = "chump_launch_draft"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

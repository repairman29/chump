[package]
name = "chump-memory-db"
version = "0.1.0"
edition = "2021"
description = "ChumpOS memory store: chump_memory.db schema/queries, episodic→semantic curation, and provider-backed summarization. Extracted from the bin crate (EFFECTIVE-410 build-speed) so it compiles + caches independently of the 190k-line binary."
repository = "https://github.com/repairman29/chump"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.25", features = ["bundled"] }
serde = { version = "1.0.118", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
axonerai = "0.1"
tracing = "0.1"
chump-db-pool = { path = "../chump-db-pool", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
async-trait = "0.1"
serial_test = "4"

[lints]
workspace = true

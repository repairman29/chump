[package]
name = "chump-test-helpers"
version = "0.1.0"
edition = "2021"
description = "INFRA-2088: canonical test-sandbox primitive for Rust tests that need full isolation from the real .chump/state.db — TempDir + env::set_var wrappers, mirroring scripts/coord/lib/test-sandbox.sh."
repository = "https://github.com/repairman29/chump"
homepage = "https://github.com/repairman29/chump/tree/main/crates/chump-test-helpers"
license = "Apache-2.0"
keywords = ["testing", "sandbox", "isolation"]
categories = ["development-tools::testing"]

[dependencies]
tempfile = "3"

[dev-dependencies]
serial_test = "4"

[lints.rust]
missing_docs = "warn"

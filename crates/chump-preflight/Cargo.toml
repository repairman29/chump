[package]
name = "chump-preflight"
version = "0.1.0"
edition = "2021"
description = "chump preflight — single-command local CI mirror. Runs fmt/clippy/check (and optional tests) locally so a PR doesn't pay the ~15-minute CI round-trip. Extracted from the chump bin (EFFECTIVE-400) so it compiles and caches independently."
repository = "https://github.com/repairman29/chump"
homepage = "https://github.com/repairman29/chump/tree/main/crates/chump-preflight"
license = "AGPL-3.0-only"

[lib]
name = "chump_preflight"
path = "src/lib.rs"

[dependencies]
chump-ambient-cli = { path = "../ambient-cli", version = "0.1.0" }
chump-atomic-claim = { path = "../chump-atomic-claim", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"

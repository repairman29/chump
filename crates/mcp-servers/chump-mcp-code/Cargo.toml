[package]
name = "chump-mcp-code"
version = "0.1.0"
edition = "2021"
description = "MCP server: symbol search over a tree-sitter code index (Rust, bash, Python), JSON-RPC over stdio"
repository = "https://github.com/repairman29/chump"
homepage = "https://github.com/repairman29/chump/tree/main/crates/mcp-servers/chump-mcp-code"
license = "AGPL-3.0-only"
keywords = ["mcp", "tree-sitter", "code-index", "agent", "json-rpc"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "chump_mcp_code"
path = "src/lib.rs"

[[bin]]
name = "chump-mcp-code"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
# Reuse the deterministic tree-sitter symbol extractor (Rust / bash / Python /
# ...) instead of re-implementing the parsers.
chump-ast-crawler = { path = "../../ast-crawler", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"

[package.metadata.dist]
dist = false

[lints]
workspace = true

[package]
name = "chump-verify"
version = "0.1.0"
edition = "2021"
description = "ChumpOS COTG verify gauntlet: external verify-merge gates, per-bullet AC judge/coverage, AC-writer, and confidence scoring. Extracted from the bin crate (EFFECTIVE-394 build-speed) so it compiles + caches independently of the 190k-line binary."
repository = "https://github.com/repairman29/chump"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chump-ambient-cli = { path = "../ambient-cli", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
serial_test = "4"

[lints]
workspace = true
